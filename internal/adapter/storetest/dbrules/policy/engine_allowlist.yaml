#
# Reviewed statements of the engine plane (tenant-isolation.md TI-9, ADR-0047
# section 2): the only queries allowed to carry "-- orcon:scope engine", that is,
# to touch organization data without an org_id restriction. tools/sqlcheck
# rejects a scope engine query that is not listed here and an entry that matches
# no query. Every addition is reviewed on its own: say why the statement must
# cross organizations.
#
# Format (a restricted YAML that sqlcheck reads without a YAML library):
#
#   - dialect: postgres        # sqlite or postgres
#     query: ClaimDueTimer     # the name after "-- name:"
#     reason: cross-organization scan of due timers (ADR-0047 section 2)
#

- dialect: postgres
  query: ExistsRouteTakenByOtherOrganization
  reason: route uniqueness check must see every organization (SPEC-002 T1)
- dialect: postgres
  query: LockTriggerRoute
  reason: route lock is global across organizations (SPEC-002 T1)
- dialect: postgres
  query: MarkTriggerRoutesChanged
  reason: route change marker is global across organizations (SPEC-002 T1)
- dialect: sqlite
  query: ClaimTokens
  reason: engine claims tokens across organizations (ADR-0047 section 2, SPEC-001 C2b)
- dialect: sqlite
  query: ClaimLastChanceToken
  reason: last-chance claim across organizations (ADR-0047 section 2, SPEC-001 C4a)
- dialect: sqlite
  query: GetOldestLastChance
  reason: oldest last-chance wait across organizations (ADR-0047 section 2, SPEC-001 C4a)
- dialect: sqlite
  query: RenewLeases
  reason: lease renewal by the engine plane across organizations (ADR-0047 section 2, SPEC-001 C2b)
- dialect: sqlite
  query: ReleaseExpiredLeases
  reason: expired lease sweep across organizations (ADR-0047 section 2, SPEC-001 C2b)
- dialect: sqlite
  query: MarkTokenAttemptsAbandoned
  reason: abandoned attempt sweep across organizations (ADR-0047 section 2, SPEC-001 C2b)
- dialect: sqlite
  query: ReleaseWorkerLeases
  reason: worker lease release across organizations (ADR-0047 section 2, SPEC-001 C4a)
- dialect: sqlite
  query: ReleaseAllLeases
  reason: startup lease release across organizations (ADR-0047 section 2, SPEC-001 C4a)
- dialect: sqlite
  query: MarkDueTimersFired
  reason: due timer scan across organizations (ADR-0047 section 2, SPEC-001 C2b)
- dialect: sqlite
  query: ClaimOutbox
  reason: outbox claim across organizations (ADR-0047 section 2, SPEC-001 C2b)
- dialect: sqlite
  query: ResolveWaitSecret
  reason: wait secret lookup by the engine plane across organizations (ADR-0047 section 2, SPEC-001 C2b)
- dialect: sqlite
  query: ExistsRouteTakenByOtherOrganization
  reason: route uniqueness check must see every organization (SPEC-002 T1)
- dialect: sqlite
  query: UpdateFlowDeletedByPrincipalToNull
  reason: clears flow.deleted_by_principal_id of every organization when a principal is deleted, in bounded batches (orcon-db IN-12, QY-8); PostgreSQL does it in orcon_engine.clear_principal_references
- dialect: sqlite
  query: UpdateFlowVersionPublishedByPrincipalToNull
  reason: clears flow_version.published_by_principal_id of every organization when a principal is deleted, in bounded batches (orcon-db IN-12, QY-8); PostgreSQL does it in orcon_engine.clear_principal_references
- dialect: sqlite
  query: UpdateMembershipInvitedByPrincipalToNull
  reason: clears membership.invited_by_principal_id of every organization when a principal is deleted, in bounded batches (orcon-db IN-12, QY-8); PostgreSQL does it in orcon_engine.clear_principal_references
- dialect: sqlite
  query: UpdateInstanceAlertAcknowledgedByPrincipalToNull
  reason: clears instance_alert.acknowledged_by_principal_id of every organization when a principal is deleted, in bounded batches (orcon-db IN-12, QY-8); PostgreSQL does it in orcon_engine.clear_principal_references
- dialect: sqlite
  query: UpdateExternalOperationResolvedByPrincipalToNull
  reason: clears external_operation.resolved_by_principal_id of every organization when a principal is deleted, in bounded batches (orcon-db IN-12, QY-8); PostgreSQL does it in orcon_engine.clear_principal_references
- dialect: sqlite
  query: UpdateHumanTaskResolvedByPrincipalToNull
  reason: clears human_task.resolved_by_principal_id of every organization when a principal is deleted, in bounded batches (orcon-db IN-12, QY-8); PostgreSQL does it in orcon_engine.clear_principal_references
- dialect: sqlite
  query: UpdateAttentionRequestAcknowledgedByPrincipalToNull
  reason: clears attention_request.acknowledged_by_principal_id of every organization when a principal is deleted, in bounded batches (orcon-db IN-12, QY-8); PostgreSQL does it in orcon_engine.clear_principal_references
- dialect: sqlite
  query: UpdateAttentionRequestResolvedByPrincipalToNull
  reason: clears attention_request.resolved_by_principal_id of every organization when a principal is deleted, in bounded batches (orcon-db IN-12, QY-8); PostgreSQL does it in orcon_engine.clear_principal_references
- dialect: sqlite
  query: UpdateOperationalAlertAcknowledgedByPrincipalToNull
  reason: clears operational_alert.acknowledged_by_principal_id of every organization when a principal is deleted, in bounded batches (orcon-db IN-12, QY-8); PostgreSQL does it in orcon_engine.clear_principal_references
- dialect: sqlite
  query: UpdateConnectorPackageInstalledByPrincipalToNull
  reason: clears connector_package.installed_by_principal_id of every organization when a principal is deleted, in bounded batches (orcon-db IN-12, QY-8); PostgreSQL does it in orcon_engine.clear_principal_references
- dialect: sqlite
  query: UpdateConnectorGrantGrantedByPrincipalToNull
  reason: clears connector_grant.granted_by_principal_id of every organization when a principal is deleted, in bounded batches (orcon-db IN-12, QY-8); PostgreSQL does it in orcon_engine.clear_principal_references
- dialect: sqlite
  query: ClaimOneToken
  reason: single-token claim across organizations, same shape as ClaimTokens, skipping executions at their cap (SPEC-001 C11, BL-126); owner approved 2026-10-15
- dialect: sqlite
  query: CountRunnableTokens
  reason: runnable token counts per flow for fair claim planning (SPEC-001 C11); returns counts only; owner approved 2026-10-15
- dialect: sqlite
  query: ResolveTriggerRoute
  reason: webhook route lookup before the organization is known (SPEC-002 T2); returns ids only; PostgreSQL uses orcon_engine.resolve_trigger_route; owner approved 2026-10-15
- dialect: sqlite
  query: ResolveUserOrganizations
  reason: lists the active organizations of one user from membership rows of every organization (SPEC-004 R-ID-02, section 7-3); PostgreSQL reads them through orcon_engine.resolve_user_organizations
- dialect: sqlite
  query: GetProjectOrganization
  reason: resolves the organization of a project across organizations so a project of another organization is hidden (ADR-0041 section 6); PostgreSQL uses orcon_engine.project_organization
- dialect: sqlite
  query: ListAuditPendingOrgs
  reason: "the audit sealer finds the organizations with pending entries; returns org_id only (SPEC-004 R-AUD-03); PostgreSQL uses orcon_engine.list_audit_pending_orgs; owner approved 2026-10-15"
- dialect: sqlite
  query: ListActiveOrgKeys
  reason: "startup check of every active organization key (SPEC-004 R-KEY-05); returns keys only in their encrypted form, in pages; PostgreSQL uses orcon_engine.list_active_org_keys; owner approved 2026-10-15"
- dialect: sqlite
  query: ListOrgsWithoutActiveKey
  reason: "the startup check finds the organizations that have no active key so it can create one (SPEC-004 R-KEY-05, SE3b); returns org_id only; PostgreSQL uses orcon_engine.list_orgs_without_active_key; urgent preview fix, orchestrator decision 2026-10-15, owner review pending"
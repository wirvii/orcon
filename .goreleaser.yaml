# SPDX-FileCopyrightText: The Orcon Authors
# SPDX-License-Identifier: Apache-2.0
# Rules: .agents/skills/orcon-contributing/references/releases.md (RL-6, RL-7). ADR 0081.
version: 2
project_name: orcon
dist: build/goreleaser
before:
  hooks:
    - make web
builds:
  - id: orcon
    main: ./cmd/orcon
    binary: orcon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - id: orcon
    ids: [orcon]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "orcon_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: dist/sbom/orcon.cdx.json
      name_template: "orcon_{{ .Version }}_sbom.cdx.json"
release:
  github:
    owner: wirvii
    name: orcon
  prerelease: auto
  extra_files:
    - glob: dist/sbom/orcon.cdx.json
      name_template: "orcon_{{ .Version }}_sbom.cdx.json"
changelog:
  disable: true
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
dockers:
  - id: orcon-amd64
    ids: [orcon]
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: build/release/Dockerfile
    image_templates: ["ghcr.io/wirvii/orcon:{{ .Version }}-amd64"]
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.source=https://github.com/wirvii/orcon
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.created={{ .CommitDate }}
      - --label=org.opencontainers.image.licenses=Apache-2.0
  - id: orcon-arm64
    ids: [orcon]
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: build/release/Dockerfile
    image_templates: ["ghcr.io/wirvii/orcon:{{ .Version }}-arm64"]
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.source=https://github.com/wirvii/orcon
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.created={{ .CommitDate }}
      - --label=org.opencontainers.image.licenses=Apache-2.0
docker_manifests:
  - name_template: "ghcr.io/wirvii/orcon:{{ .Version }}"
    image_templates:
      - "ghcr.io/wirvii/orcon:{{ .Version }}-amd64"
      - "ghcr.io/wirvii/orcon:{{ .Version }}-arm64"
  - name_template: "ghcr.io/wirvii/orcon:latest"
    skip_push: auto
    image_templates:
      - "ghcr.io/wirvii/orcon:{{ .Version }}-amd64"
      - "ghcr.io/wirvii/orcon:{{ .Version }}-arm64"
docker_signs:
  - cmd: cosign
    artifacts: manifests
    args: ["sign", "--yes", "${artifact}@${digest}"]

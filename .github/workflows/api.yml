# Public API contract checks (orcon-api, SPEC-012; ADR 0080). api-contract is a required
# check: it has no paths filter, so it always runs on a pull request, on main and in the
# merge queue. The examples run on SQLite here; PostgreSQL runs in api-nightly.yml and is
# never part of a pull request. api-release runs only on a release tag.
name: API
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  api-contract:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      # Full history: api-compat reads the last release tag and its contract.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Contract lint, compatibility, changelog self-test, reference site and examples (SQLite)
        env:
          API_SUMMARY_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: make tools api-check api-examples

  api-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: The committed API changelog of this version matches the contract
        env:
          VERSION: ${{ github.ref_name }}
        run: make api-changelog-check VERSION="$VERSION"
      - name: Build the reference site
        run: make api-reference
      - name: Keep the reference site with the release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-reference-${{ github.ref_name }}
          path: dist/api-reference*
          if-no-files-found: error

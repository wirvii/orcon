name: Web
# Web application gates (SPEC-010 §4.12). The jobs web-check, web-e2e and web-perf run the same
# targets as a local checkout (mk/web.mk). No paths filter: a required job that does not run
# blocks the pull request forever.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # changes computes the areas the change touches (scripts/ci-changes.sh). Jobs below use
  # job-level `if:` on its outputs and never a workflow-level paths filter: a skipped job
  # counts as passed for a required check. Any doubt runs everything.
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.areas.outputs.go }}
      web: ${{ steps.areas.outputs.web }}
      api: ${{ steps.areas.outputs.api }}
      skills: ${{ steps.areas.outputs.skills }}
      docs: ${{ steps.areas.outputs.docs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: areas
        uses: ./.github/actions/changes

  web-check:
    needs: changes
    if: (needs.changes.outputs.web == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the Chromium browser for the component tests
        run: pnpm --filter @orcon/ui exec playwright install --with-deps chromium
      - name: Web checks
        run: make web-check
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
  web-e2e:
    needs: changes
    if: (needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter '@orcon/ui^...' build
      - name: Install the Chromium browser
        run: pnpm --filter @orcon/web exec playwright install --with-deps chromium
      - name: End-to-end journeys against the binary
        run: make web-e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-traces-${{ github.run_id }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
  web-perf:
    needs: changes
    if: (needs.changes.outputs.web == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter '@orcon/ui^...' build
      - name: Install the Chromium browser
        run: pnpm --filter @orcon/web exec playwright install --with-deps chromium
      - name: Performance budgets (emulated phone profile)
        run: make web-perf
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-perf-${{ github.run_id }}
          path: apps/web/test-results
          if-no-files-found: ignore

name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.work
      - name: Test Go modules
        run: go test ./apps/orcon ./packages/go/config ./packages/go/workflow ./packages/go/engine
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.work
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build embedded frontend and Go binary
        run: make build
      - name: Smoke test standalone
        shell: bash
        run: |
          ./bin/orcon --role=standalone --addr=127.0.0.1:18080 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz | grep -q ok
          curl -fsS http://127.0.0.1:18080/ | grep -q 'id="root"'
          ./bin/orcon --role=invalid >/dev/null 2>&1 && exit 1 || true
  ui-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test lint rules
        run: pnpm --filter @orcon/lint-config test
      - name: Test tokens
        run: pnpm --filter @orcon/tokens test
      - name: Contrast report is up to date
        run: git diff --exit-code .agents/skills/orcon-ui/references/contrast-report.md
      - name: Check translations
        run: pnpm i18n:check
      - name: Build Storybook
        run: pnpm --filter @orcon/ui build-storybook
      - name: Unit tests
        run: pnpm --filter @orcon/ui test:unit
      - name: Story coverage
        run: pnpm --filter @orcon/ui test:stories
      - name: Component accessibility
        run: pnpm --filter @orcon/ui test:a11y
      - name: Touch targets and density
        run: pnpm --filter @orcon/ui test:targets
      - name: Build web app
        run: pnpm --filter @orcon/web build
      - name: Fonts are bundled and none is requested externally
        shell: bash
        run: |
          if grep -rEq 'fonts\.(googleapis|gstatic)\.com|https?://[^"]+\.(woff2?|ttf|otf)' apps/web/dist; then
            echo "external font reference found"; exit 1
          fi
          find apps/web/dist/assets -iname '*inter*.woff2' | grep -q .
          find apps/web/dist/assets -iname '*jetbrains*.woff2' | grep -q .
      - name: Install the browser for the web accessibility check
        run: pnpm --filter @orcon/web exec playwright install --with-deps chromium
      - name: Web accessibility
        run: pnpm --filter @orcon/web test:a11y
  ui-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Baselines are committed
        shell: bash
        run: |
          if ! find packages/js/ui/visual/__screenshots__ -name '*.png' 2>/dev/null | grep -q .; then
            echo "::error title=Visual baselines missing::packages/js/ui/visual/__screenshots__ has no screenshots. Run the 'Visual baselines' workflow (workflow_dispatch), download its artifact, commit the folder, then re-run this job."
            exit 1
          fi
      - name: Build Storybook on the host
        run: pnpm --filter @orcon/ui build-storybook
      - name: Run the visual suite in the pinned Playwright container
        run: sh packages/js/ui/visual/run-docker.sh
      - name: Upload the difference report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-report
          path: |
            packages/js/ui/visual/report
            packages/js/ui/visual/test-results
          if-no-files-found: ignore
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Validate the skill
        run: sh .agents/skills/orcon-ui/validation/run.sh
      - name: Both skill projections are identical
        run: diff -r .agents/skills/orcon-ui .claude/skills/orcon-ui
      - name: Validate against the Agent Skills standard
        run: uvx --from "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref" skills-ref validate .agents/skills/orcon-ui

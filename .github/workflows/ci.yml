name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
# A newer push to a pull request supersedes the run in flight; main and the merge
# queue are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # changes computes the areas the change touches (scripts/ci-changes.sh). Jobs below use
  # job-level `if:` on its outputs and never a workflow-level paths filter: a skipped job
  # counts as passed for a required check. Any doubt runs everything.
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.areas.outputs.go }}
      web: ${{ steps.areas.outputs.web }}
      api: ${{ steps.areas.outputs.api }}
      skills: ${{ steps.areas.outputs.skills }}
      docs: ${{ steps.areas.outputs.docs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: areas
        uses: ./.github/actions/changes

  # ---------------------------------------------------------------------------
  # SPEC-008 G5 block: Go gate (tooling.md TOOL-3). Required jobs: check, provenance.
  # ---------------------------------------------------------------------------

  # check runs the one gate on the two latest Go releases. GOTOOLCHAIN=local keeps
  # the product code on the toolchain under test. The tools module needs a newer Go
  # than oldstable; the Makefile lets only those tool commands fetch it
  # (GOTOOLCHAIN=auto for tools/go.mod), so no workflow step changes the toolchain.
  # The job always runs and each step is gated on the Go area: a matrix job skipped by a
  # job-level `if:` reports under its unexpanded name, so the required "check (go oldstable)"
  # and "check (go stable)" would never report. Without Go changes it ends in seconds.
  check:
    name: check (go ${{ matrix.go }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
    env:
      GOTOOLCHAIN: local
      # Base revision of the migration immutability check (dbcheck migration-immutable).
      # Empty on pushes: dbcheck then uses the merge base with origin/main.
      DBCHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      # Full history: db-check compares migrations.sum with the base revision and
      # looks for release tags.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.go == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: needs.changes.outputs.go == 'true'
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: needs.changes.outputs.go == 'true'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: needs.changes.outputs.go == 'true'
        with:
          path: .bin
          key: bin-${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('tools/versions.mk', 'go.mod', 'tools/go.mod') }}
      # The BPMN round trip is validated against the OMG BPMN 2.0 XSD
      # (SPEC-001 E-FMT-4). The schema files are fetched, checked against pinned
      # digests and never committed; TestRoundTripXSD fails in this job without them
      # (ORCON_BPMN_XSD_REQUIRED) and skips in jobs that do not fetch them.
      - name: Install xmllint
        if: needs.changes.outputs.go == 'true'
        run: |
          command -v xmllint >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils; }
      - name: Fetch the BPMN 2.0 schema
        if: needs.changes.outputs.go == 'true'
        run: |
          sh scripts/fetch-bpmn-xsd.sh "$RUNNER_TEMP/bpmn-xsd"
          echo "ORCON_BPMN_XSD_DIR=$RUNNER_TEMP/bpmn-xsd" >> "$GITHUB_ENV"
          echo "ORCON_BPMN_XSD_REQUIRED=1" >> "$GITHUB_ENV"
      - run: make check
        if: needs.changes.outputs.go == 'true'

  # provenance keeps AI authorship marks out of the pull request range, its title
  # and its description (SPEC-008 4.11). Pushes to main check before..after.
  provenance:
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: tools/go.sum
      - name: Build the provenance tool
        run: cd tools && GOWORK=off go build -o ../.bin/provenance ./provenance
      - name: Check the pull request range, title and description
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          .bin/provenance range "$BASE_SHA" "$HEAD_SHA" --pr-title "$PR_TITLE" --pr-body-file "$RUNNER_TEMP/pr-body.md"
      - name: Check the commits of the merge group
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: .bin/provenance range "$BASE_SHA" "$HEAD_SHA"
      - name: Check the commits of the push
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: .bin/provenance range "$BEFORE_SHA" "$AFTER_SHA"

  # postgres runs the adapter contract suites and the database rule checks against
  # real PostgreSQL: the oldest supported release (14) and the latest (17), pinned
  # by image digest. Keep the digests equal to PG_IMAGES in the Makefile.
  postgres-matrix:
    needs: changes
    name: postgres (${{ matrix.image }})
    if: (needs.changes.outputs.go == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:14@sha256:14bfab572eec6abf65892e1db7c3ba8d41b2a2855c1b143664907d6e146eb6e1
          - postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    env:
      GOTOOLCHAIN: local
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      # Full history: test-compat-floor checks out the release tag of every declared floor.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Adapter tests against PostgreSQL
        run: make test-postgres PG_IMAGES=${{ matrix.image }}
      - name: Compatibility floors and the expand/contract control
        env:
          ORCON_TEST_POSTGRES_IMAGE: ${{ matrix.image }}
        run: |
          make tools
          make test-compat-floor
      - name: Planted database violations
        env:
          ORCON_TEST_POSTGRES_IMAGE: ${{ matrix.image }}
        run: make db-fixtures

  # postgres is the single required status check for the matrix above, so the
  # ruleset does not depend on the image digests in the leg names. It fails when
  # any leg failed, was cancelled or was skipped while the Go area changed.
  postgres:
    name: postgres
    runs-on: ubuntu-latest
    needs: [changes, postgres-matrix]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Require every postgres leg to pass
        env:
          RESULT: ${{ needs.postgres-matrix.result }}
          GO_CHANGED: ${{ needs.changes.outputs.go }}
        run: |
          # The matrix is skipped, on purpose, when the change touches no Go area.
          if [ "$RESULT" = "skipped" ] && [ "$GO_CHANGED" = "false" ]; then
            echo "postgres matrix skipped: no Go area changed"
            exit 0
          fi
          if [ "$RESULT" != "success" ]; then
            echo "postgres matrix result: $RESULT (Go area changed: $GO_CHANGED)"
            exit 1
          fi

  # sbom publishes the CycloneDX bill of materials of a release (dependencies.md DEP-4).
  sbom:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: tools/go.sum
      - name: Generate the SBOM
        run: make sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: dist/sbom/orcon.cdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # End of the SPEC-008 G5 block. Jobs below are not part of the Go gate.
  # ---------------------------------------------------------------------------
  integration:
    needs: changes
    if: (needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.work
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build embedded frontend and Go binary
        run: make build
      - name: Smoke test standalone
        run: make smoke
  ui-quality:
    needs: changes
    if: (needs.changes.outputs.web == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter '@orcon/ui^...' build
      - name: Install the Chromium browser for component and web accessibility checks
        run: pnpm --filter @orcon/ui exec playwright install --with-deps chromium
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test lint rules
        run: pnpm --filter @orcon/lint-config test
      - name: Test tokens
        run: pnpm --filter @orcon/tokens test
      - name: Contrast report is up to date
        run: git diff --exit-code .agents/skills/orcon-ui/references/contrast-report.md
      - name: Check translations
        run: pnpm i18n:check
      - name: Build Storybook
        run: pnpm --filter @orcon/ui build-storybook
      - name: Unit tests
        run: pnpm --filter @orcon/ui test:unit
      - name: Story coverage
        run: pnpm --filter @orcon/ui test:stories
      - name: Component accessibility
        run: pnpm --filter @orcon/ui test:a11y
      - name: Touch targets and density
        run: pnpm --filter @orcon/ui test:targets
      - name: Canvas
        run: pnpm --filter @orcon/ui test:canvas
      - name: Parity and parity coverage
        run: pnpm --filter @orcon/ui test:parity
      - name: Expansion
        run: pnpm --filter @orcon/ui test:expansion
      - name: Build web app
        run: pnpm --filter @orcon/web build
      - name: Fonts are bundled and none is requested externally
        shell: bash
        run: |
          if grep -rEq 'fonts\.(googleapis|gstatic)\.com|https?://[^"]+\.(woff2?|ttf|otf)' apps/web/dist; then
            echo "external font reference found"; exit 1
          fi
          find apps/web/dist/assets -iname '*inter*.woff2' | grep -q .
          find apps/web/dist/assets -iname '*jetbrains*.woff2' | grep -q .
      - name: Web accessibility
        run: pnpm --filter @orcon/web test:a11y
  ui-visual:
    needs: changes
    if: (needs.changes.outputs.web == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter '@orcon/ui^...' build
      - name: Baselines are committed
        shell: bash
        run: |
          if [ -z "$(find packages/js/ui/visual/__screenshots__ -name '*.png' -print -quit 2>/dev/null)" ]; then
            echo "::error title=Visual baselines missing::packages/js/ui/visual/__screenshots__ has no screenshots. Run the 'Visual baselines' workflow (workflow_dispatch), download its artifact, commit the folder, then re-run this job."
            exit 1
          fi
      - name: Build Storybook on the host and run the visual suite in the pinned Playwright container
        run: pnpm --filter @orcon/ui test:visual:docker
      - name: Upload the difference report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-report
          path: |
            packages/js/ui/visual/report
            packages/js/ui/visual/test-results
          if-no-files-found: ignore
  skills:
    needs: changes
    if: (needs.changes.outputs.skills == 'true' || needs.changes.outputs.docs == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Validate the skills
        run: |
          for skill in orcon-ui orcon-api orcon-connector orcon-contributing orcon-web; do
            sh ".agents/skills/$skill/validation/run.sh"
          done
      - name: Validate against the Agent Skills standard
        run: |
          for skill in orcon-ui orcon-api orcon-connector orcon-contributing orcon-web; do
            uvx --from "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref" skills-ref validate ".agents/skills/$skill"
          done

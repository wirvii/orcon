# Contribution workflow and release configuration checks (orcon-contributing; ADR 0081).
# release-check builds a release snapshot without publishing: six archives, sums, the
# SBOM and the images are produced and checked, and the contribution tooling self-tests run.
name: Contributing
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
# A newer push to a pull request supersedes the run in flight; the merge queue is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # changes computes the areas the change touches (scripts/ci-changes.sh). Jobs below use
  # job-level `if:` on its outputs and never a workflow-level paths filter: a skipped job
  # counts as passed for a required check. Any doubt runs everything.
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.areas.outputs.go }}
      web: ${{ steps.areas.outputs.web }}
      api: ${{ steps.areas.outputs.api }}
      skills: ${{ steps.areas.outputs.skills }}
      docs: ${{ steps.areas.outputs.docs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: areas
        uses: ./.github/actions/changes

  release-check:
    needs: changes
    if: (needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Release tools, contribution self-tests and release snapshot
        run: make release-tools contrib-check release-check

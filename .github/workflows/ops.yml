# Operations checks (SPEC-015; ADR 0083): the references generated from the code are up to
# date. Later cuts add the Helm, monitoring, compose and installer checks to `make ops-check`.
name: Ops
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Operations checks
        run: make ops-check

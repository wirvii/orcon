name: Bug report
description: Something does not work as documented
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must be reported privately: https://github.com/wirvii/orcon/security/advisories/new
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Describe what you expected to happen, and where it is documented if you know.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps, flow definition or command that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Orcon version
      description: The output of `orcon --version`, or the commit you built from.
  - type: dropdown
    id: role
    attributes:
      label: Runtime role
      options:
        - standalone
        - api
        - scheduler
        - worker
        - not sure
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite
        - PostgreSQL
        - not applicable
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output; remove secrets and personal data.
      render: text
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues
          required: true
        - label: This report contains no secrets or personal data
          required: true

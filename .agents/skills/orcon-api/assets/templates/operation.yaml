# Template: one action operation with every required x-orcon extension.
# Copy into packages/openapi/v1/paths/<resource>.yaml, replace the flow example with your
# resource, then run `make api-lint`. Rules: references/extensions.md.
/flows/{flowId}/publish:
  x-orcon-resource: action
  parameters:
    - $ref: '#/components/parameters/FlowId'
  post:
    operationId: publishFlow
    summary: Publish a flow draft
    description: >-
      Creates a new immutable version of the flow from its current draft and makes it the
      version that new executions use while the flow is active. Use it after the draft
      validates without errors; executions already running keep the version they started with.
    tags: [flows]
    x-orcon-permission: flow:publish
    x-orcon-rate-class: write
    x-orcon-stability: stable
    x-orcon-idempotency: optional
    x-orcon-audit: flow.published
    x-orcon-problems:
      - unauthenticated
      - forbidden
      - not-found
      - validation-failed
      - payload-too-large
      - precondition-required
      - precondition-failed
      - idempotency-key-reused
      - idempotency-in-progress
      - project-managed-by-git
      - rate-limited
      - internal-error
    x-orcon-cli:
      command: flows publish
    x-orcon-mcp:
      level: destructive
      tool: publish_flow
      description: Publish the current draft of a flow as a new version.
    x-orcon-examples:
      - name: publishValidDraft
        scenario: flow-with-valid-draft
        request:
          pathParams:
            flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
          headers:
            If-Match: '"7"'
            Idempotency-Key: publish-example-1
          body: publishValidDraft
        response:
          status: 200
          body: publishValidDraft
      - name: staleDraftRevision
        scenario: flow-with-valid-draft
        request:
          pathParams:
            flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
          headers:
            If-Match: '"6"'
          body: publishValidDraft
        response:
          status: 412
          body: staleDraftRevision
    parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublishFlowRequest'
          examples:
            publishValidDraft:
              summary: Publish with a release note
              value:
                note: Retry the CRM step on rate limits
    responses:
      '200':
        description: The new published version of the flow.
        headers:
          ETag:
            $ref: '#/components/headers/ETag'
          Orcon-Request-Id:
            $ref: '#/components/headers/OrconRequestId'
          RateLimit:
            $ref: '#/components/headers/RateLimit'
          RateLimit-Policy:
            $ref: '#/components/headers/RateLimitPolicy'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowVersion'
            examples:
              publishValidDraft:
                summary: Version 8 published
                value:
                  flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
                  version: 8
                  note: Retry the CRM step on rate limits
                  publishedAt: '2026-10-12T15:04:05Z'
                  publishedByPrincipalId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a61
      '400':
        $ref: '#/components/responses/ValidationFailed'
      '401':
        $ref: '#/components/responses/Unauthenticated'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/Conflict'
      '412':
        description: The draft changed since the revision in If-Match.
        content:
          application/problem+json:
            schema:
              $ref: '#/components/schemas/Problem'
            examples:
              staleDraftRevision:
                summary: Draft revision 7 is current
                value:
                  type: urn:orcon:problem:precondition-failed
                  title: Precondition failed
                  status: 412
                  detail: The draft revision is 7, not 6.
                  instance: /api/v1/flows/0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60/publish
                  code: precondition-failed
                  requestId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a62
                  errors: []
      '413':
        $ref: '#/components/responses/PayloadTooLarge'
      '422':
        $ref: '#/components/responses/IdempotencyKeyReused'
      '428':
        $ref: '#/components/responses/PreconditionRequired'
      '429':
        $ref: '#/components/responses/RateLimited'
      '500':
        $ref: '#/components/responses/InternalError'

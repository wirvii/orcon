Credential:
  type: object
  description: >-
    A credential: the secret settings a project keeps to call an outside service. Secret fields are never
    returned; the secret object tells whether one is set and when and by whom it was last written.
  required:
    - id
    - projectId
    - owned
    - name
    - type
    - status
    - allowedHosts
    - versionCount
    - secret
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: Id of the credential.
      examples:
        - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a90
      readOnly: true
    projectId:
      type: string
      format: uuid
      description: Id of the project that owns the credential.
      examples:
        - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
    owned:
      type: boolean
      description: >-
        Whether the project the list belongs to owns the credential. A credential shared with the project
        can be used by its flows but only the owning project can change it.
    name:
      type: string
      description: Name of the credential, unique inside the owning project.
      examples:
        - Slack notifications
      maxLength: 100
    type:
      type: string
      description: Connector reference of the credential type, for example the connector the secret serves.
      examples:
        - orcon.http@1
      maxLength: 255
    status:
      type: string
      description: >-
        OK when the credential can be used. NEEDS_SECRET means a value is missing, NEEDS_REAUTH means an
        OAuth grant must be given again, DISABLED means the owner switched it off.
      enum:
        - OK
        - NEEDS_SECRET
        - NEEDS_REAUTH
        - DISABLED
      x-orcon-enum-kind: identifier
      examples:
        - OK
    allowedHosts:
      type: array
      description: >-
        Hosts the secret may be sent to. A request to any other host never receives the secret. An entry
        may start with one wildcard label, for example *.example.com.
      maxItems: 50
      items:
        type: string
        maxLength: 253
        examples:
          - hooks.slack.com
    versionCount:
      type: integer
      description: Number of versions of the secret. Replacing the secret adds one.
      minimum: 1
      examples:
        - 2
    secret:
      $ref: ../openapi.yaml#/components/schemas/CredentialSecret
    publicFields:
      type: object
      description: >-
        Non-secret fields of the current version, by field name. Present when a single credential is returned;
        absent from list items.
      additionalProperties:
        type: string
        maxLength: 4096
      examples:
        - region: eu-west-1
    createdAt:
      type: string
      format: date-time
      description: When the credential was created, in UTC.
      examples:
        - '2026-10-12T15:04:05Z'
      readOnly: true
    updatedAt:
      type: string
      format: date-time
      description: When the credential last changed, in UTC. Changing the secret also changes it.
      examples:
        - '2026-10-12T15:04:05Z'
      readOnly: true
CredentialSecret:
  type: object
  description: >-
    What a reader learns about the secret of a credential. The value itself is never returned, to anyone.
  required:
    - set
  properties:
    set:
      type: boolean
      description: Whether a secret value is stored.
      examples:
        - true
    updatedAt:
      type: string
      format: date-time
      description: When the secret was last written, in UTC; absent when no secret is set.
      examples:
        - '2026-10-12T15:04:05Z'
    updatedBy:
      type: string
      format: uuid
      description: Id of the principal that last wrote the secret; absent when no secret is set.
      examples:
        - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a91
CredentialList:
  type: object
  description: One page of credentials.
  required:
    - items
  properties:
    items:
      type: array
      description: The items of this page.
      items:
        $ref: ../openapi.yaml#/components/schemas/Credential
    nextPageToken:
      type: string
      description: Token for the next page; absent on the last page.
      examples:
        - example-page-token-2
      maxLength: 1024
CreateCredentialRequest:
  type: object
  description: Fields of a new credential. Secret field values are stored and never returned.
  required:
    - name
    - type
    - secretFields
  additionalProperties: false
  properties:
    name:
      type: string
      description: Name of the credential, unique inside the project.
      examples:
        - Slack notifications
      maxLength: 100
    type:
      type: string
      description: Connector reference of the credential type.
      examples:
        - orcon.http@1
      maxLength: 255
    allowedHosts:
      type: array
      description: Hosts the secret may be sent to; empty means none until you add some.
      maxItems: 50
      items:
        type: string
        maxLength: 253
        examples:
          - hooks.slack.com
    publicFields:
      type: object
      description: Non-secret fields, by field name.
      maxProperties: 64
      additionalProperties:
        type: string
        maxLength: 4096
      examples:
        - region: eu-west-1
    secretFields:
      type: object
      description: >-
        Secret fields, by field name. Write-only: they are stored encrypted and never returned. At least one
        field is required.
      minProperties: 1
      maxProperties: 64
      additionalProperties:
        type: string
        maxLength: 65536
      examples:
        - token: xoxb-example-value
UpdateCredentialRequest:
  type: object
  description: >-
    Fields of a credential to change (JSON Merge Patch). The secret is changed with replaceCredentialSecret.
  additionalProperties: false
  properties:
    name:
      type: string
      description: New name of the credential.
      examples:
        - Slack alerts
      maxLength: 100
    allowedHosts:
      type: array
      description: New list of hosts the secret may be sent to; replaces the previous list.
      maxItems: 50
      items:
        type: string
        maxLength: 253
        examples:
          - hooks.slack.com
ReplaceCredentialSecretRequest:
  type: object
  description: >-
    The new version of a credential: its secret fields and, optionally, its public fields. The new version
    becomes current; earlier versions are kept. When publicFields is absent the public fields of the current
    version are kept.
  required:
    - secretFields
  additionalProperties: false
  properties:
    publicFields:
      type: object
      description: Non-secret fields of the new version, by field name.
      maxProperties: 64
      additionalProperties:
        type: string
        maxLength: 4096
      examples:
        - region: eu-west-1
    secretFields:
      type: object
      description: Secret fields of the new version. Write-only, as in the creation.
      minProperties: 1
      maxProperties: 64
      additionalProperties:
        type: string
        maxLength: 65536
      examples:
        - token: xoxb-rotated-example-value
ShareCredentialRequest:
  type: object
  description: The project that may use the credential. Sharing gives use without read.
  required:
    - projectId
  additionalProperties: false
  properties:
    projectId:
      type: string
      format: uuid
      description: Id of the project that may use the credential; it must belong to the same organization.
      examples:
        - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a77

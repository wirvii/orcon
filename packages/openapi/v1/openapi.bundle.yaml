components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API key, a service account token or a session token, sent as a bearer credential.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-orcon_session
      description: The browser session, set by createSession as an HttpOnly, Secure, SameSite=Lax cookie with Path=/. Browsers also hold a readable CSRF cookie, __Host-orcon_csrf (Secure, SameSite=Strict, Path=/). Every unsafe request (POST, PUT, PATCH, DELETE) authenticated by this cookie must send the value of that CSRF cookie in the Orcon-Csrf-Token header and must come from the public origin of the installation; otherwise the response is 403 csrf-check-failed. Requests that carry an API key as a bearer credential use no cookie and no CSRF token.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Id of the session.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a80
    OrgId:
      name: orgId
      in: path
      required: true
      description: Id of the organization.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a71
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Id of the project.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
    FlowId:
      name: flowId
      in: path
      required: true
      description: Id of the flow.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
    ExecutionId:
      name: executionId
      in: path
      required: true
      description: Id of the execution.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a64
    TestSessionId:
      name: testSessionId
      in: path
      required: true
      description: Id of the test session.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a69
    ExternalOperationId:
      name: externalOperationId
      in: path
      required: true
      description: Id of the external operation.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a67
    CredentialId:
      name: credentialId
      in: path
      required: true
      description: Id of the credential.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a90
    HumanTaskId:
      name: humanTaskId
      in: path
      required: true
      description: Id of the human task.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a68
    Version:
      name: version
      in: path
      required: true
      description: Number of the flow version, starting at 1.
      schema:
        type: integer
        minimum: 1
        examples:
          - 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the representation the change is based on.
      schema:
        type: string
        maxLength: 255
        examples:
          - '"1"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client key that makes a retried request return the first response.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[\x21-\x7E]+$
        examples:
          - publish-example-1
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Client key that makes a retried request return the first response.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[\x21-\x7E]+$
        examples:
          - run-example-1
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items in the page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
        examples:
          - 50
    PageToken:
      name: pageToken
      in: query
      required: false
      description: Opaque token from nextPageToken of the previous page.
      schema:
        type: string
        maxLength: 1024
        examples:
          - example-page-token-2
  headers:
    ETag:
      description: Strong entity tag of the returned representation.
      schema:
        type: string
        examples:
          - '"1"'
    Location:
      description: Absolute path of the created resource or of the resource that tracks the work.
      schema:
        type: string
        maxLength: 2048
        examples:
          - /api/v1/executions/0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a64
    OrconRequestId:
      description: Id of the request, also present in logs and problem documents.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a62
    RateLimit:
      description: Remaining quota of the rate class in the current window.
      schema:
        type: string
        examples:
          - '"write";r=118;t=42'
    RateLimitPolicy:
      description: Quota policy of the rate class.
      schema:
        type: string
        examples:
          - '"write";q=300;w=60'
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
        examples:
          - 30
  schemas:
    Problem:
      type: object
      description: A problem document (RFC 9457). Every error of a non-protocol operation is one.
      required:
        - type
        - title
        - status
        - code
        - requestId
      properties:
        type:
          type: string
          format: uri
          description: urn:orcon:problem:<code>.
          examples:
            - urn:orcon:problem:not-found
        title:
          type: string
          description: Short summary of the problem type.
          examples:
            - Not found
          maxLength: 200
        status:
          type: integer
          description: HTTP status code.
          examples:
            - 404
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Explanation of this occurrence. It never contains secrets or data of another organization.
          examples:
            - The flow does not exist.
          maxLength: 2000
        instance:
          type: string
          description: Path of the request that failed.
          examples:
            - /api/v1/flows/0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
          maxLength: 2048
        code:
          $ref: '#/components/schemas/ProblemCode'
          description: Stable code of the problem.
        requestId:
          type: string
          format: uuid
          description: Id of the request; the same value is in the Orcon-Request-Id header.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a62
        errors:
          type: array
          description: One entry per invalid field.
          items:
            $ref: '#/components/schemas/ProblemFieldError'
        currentDraftRevision:
          type: integer
          description: 'On a 412 of a draft: the revision the draft has now, so a client can rebase without another read.'
          examples:
            - 8
          minimum: 0
        updatedBy:
          type: string
          format: uuid
          description: 'On a 412 of a draft: the principal that saved the revision now stored.'
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a61
        confirmationId:
          type: string
          format: uuid
          description: 'On a confirmation-required problem: the id of the stored confirmation a person must approve.'
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a99
        expiresAt:
          type: string
          format: date-time
          description: 'On a confirmation-required problem: when the stored confirmation lapses, in UTC.'
          examples:
            - '2026-10-14T09:30:00Z'
    ProblemFieldError:
      type: object
      description: One error of one request field.
      required:
        - pointer
        - code
        - message
      properties:
        pointer:
          type: string
          description: JSON Pointer into the request.
          examples:
            - /note
          maxLength: 1024
        code:
          type: string
          description: Stable code of the field error.
          examples:
            - too-long
          maxLength: 100
        message:
          type: string
          description: Explanation for a person.
          examples:
            - The note is longer than 500 characters.
          maxLength: 1000
    SessionCredentials:
      type: object
      description: The email and the password of an account that signs in.
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Email of the account; compared case-insensitively.
          examples:
            - ana@example.com
          maxLength: 320
        password:
          type: string
          writeOnly: true
          description: Password of the account. It is never returned.
          examples:
            - example-secret-1
          minLength: 1
          maxLength: 1024
    Session:
      type: object
      description: A browser session. The token that proves it is only in the session cookie, never in the body.
      required:
        - id
        - createdAt
        - expiresAt
        - idleExpiresAt
        - assuranceLevel
      properties:
        id:
          type: string
          format: uuid
          description: Id of the session; it is what revoking the session names.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a80
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: When the session started, in UTC.
          examples:
            - '2026-10-14T15:04:05Z'
        expiresAt:
          type: string
          format: date-time
          description: When the session ends whatever its activity (maximum age), in UTC.
          examples:
            - '2026-11-13T15:04:05Z'
        idleExpiresAt:
          type: string
          format: date-time
          description: When the session ends without activity (idle timeout), in UTC.
          examples:
            - '2026-10-14T23:04:05Z'
        assuranceLevel:
          type: string
          description: How strongly the user was verified; AAL1 is a password, AAL2 adds a second factor.
          x-orcon-enum-kind: identifier
          enum:
            - AAL1
            - AAL2
          examples:
            - AAL1
    CurrentUser:
      type: object
      description: The signed-in user and the session the request carries.
      required:
        - id
        - email
        - displayName
        - currentSession
      properties:
        id:
          type: string
          format: uuid
          description: Id of the user.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a81
          readOnly: true
        email:
          type: string
          format: email
          description: Email of the user.
          examples:
            - ana@example.com
          maxLength: 320
        displayName:
          type: string
          description: Name the user is shown with.
          examples:
            - Ana Torres
          maxLength: 200
        currentSession:
          description: The session the request carries.
          $ref: '#/components/schemas/Session'
        orgRoles:
          type: array
          description: The organization role the user holds in each organization it belongs to, for the organization menu. An organization in which the user holds no organization-level role is left out.
          readOnly: true
          items:
            $ref: '#/components/schemas/OrgRole'
    OrgRole:
      type: object
      description: The organization-level role a user holds in one organization.
      required:
        - orgId
        - role
      properties:
        orgId:
          type: string
          format: uuid
          description: Id of the organization.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a71
        role:
          type: string
          description: Name of the predefined role, one of Owner, Admin, Member, Project Admin, Editor, Operator or Viewer.
          examples:
            - Owner
          maxLength: 100
    ActivitySummary:
      type: object
      description: The activity of an organization that its home screen shows. Every count covers only the projects the caller can read.
      required:
        - activeFlowCount
        - flowCount
        - projectCount
        - executionsLast24h
        - timeSaved
      properties:
        activeFlowCount:
          type: integer
          description: Number of flows that are active, in the projects the caller reads.
          examples:
            - 4
          minimum: 0
          readOnly: true
        flowCount:
          type: integer
          description: Number of flows that are not deleted, in the projects the caller reads.
          examples:
            - 9
          minimum: 0
          readOnly: true
        projectCount:
          type: integer
          description: Number of projects the caller reads.
          examples:
            - 2
          minimum: 0
          readOnly: true
        executionsLast24h:
          $ref: '#/components/schemas/ActivityExecutionCounts'
        timeSaved:
          $ref: '#/components/schemas/ActivityTimeSaved'
    ActivityExecutionCounts:
      type: object
      description: The executions accepted in the last 24 hours, in the projects the caller reads.
      required:
        - total
        - failed
        - succeeded
        - uncertain
        - byHour
      properties:
        total:
          type: integer
          description: Number of executions accepted in the last 24 hours.
          examples:
            - 128
          minimum: 0
          readOnly: true
        failed:
          type: integer
          description: Number of those executions that failed.
          examples:
            - 3
          minimum: 0
          readOnly: true
        succeeded:
          type: integer
          description: Number of those executions that succeeded.
          examples:
            - 120
          minimum: 0
          readOnly: true
        uncertain:
          type: integer
          description: Number of those executions that have an external operation whose outcome is unknown, so a person must review them.
          examples:
            - 2
          minimum: 0
          readOnly: true
        byHour:
          type: array
          description: Executions accepted in each hour of the last 24 hours, the oldest hour first; the last item is the current hour.
          readOnly: true
          minItems: 24
          maxItems: 24
          items:
            type: integer
            minimum: 0
          examples:
            - - 0
              - 0
              - 1
              - 4
              - 9
              - 12
              - 8
              - 6
              - 5
              - 7
              - 11
              - 13
              - 9
              - 8
              - 6
              - 5
              - 4
              - 3
              - 2
              - 1
              - 0
              - 0
              - 0
              - 0
    ActivityTimeSaved:
      type: object
      description: The time the organization saves by its successful automated executions in the last 7 days, estimated as the minutes per execution the organization sets. Test runs are not counted.
      required:
        - windowDays
        - succeededExecutions
        - minutesPerExecution
        - minutes
      properties:
        windowDays:
          type: integer
          description: Length of the window in days.
          examples:
            - 7
          minimum: 1
          readOnly: true
        succeededExecutions:
          type: integer
          description: Number of automated executions that succeeded in the window.
          examples:
            - 96
          minimum: 0
          readOnly: true
        minutesPerExecution:
          type: integer
          description: Minutes the organization saves per automated execution that succeeded.
          examples:
            - 3
          minimum: 0
          maximum: 600
          readOnly: true
        minutes:
          type: integer
          description: Estimated minutes saved in the window (succeededExecutions times minutesPerExecution).
          examples:
            - 288
          minimum: 0
          readOnly: true
    Organization:
      type: object
      description: An organization the user belongs to.
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Id of the organization.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a71
          readOnly: true
        slug:
          type: string
          description: Short name of the organization, unique across the installation; it appears in URLs.
          examples:
            - acme
          maxLength: 100
        name:
          type: string
          description: Display name of the organization.
          examples:
            - Acme
          maxLength: 200
    OrganizationList:
      type: object
      description: One page of organizations.
      required:
        - items
      properties:
        items:
          type: array
          description: The items of this page.
          items:
            $ref: '#/components/schemas/Organization'
        nextPageToken:
          type: string
          description: Token for the next page; absent on the last page.
          examples:
            - example-page-token-2
          maxLength: 1024
    ProblemCode:
      type: string
      description: Stable code of a problem; the type URI is urn:orcon:problem:<code>.
      x-orcon-enum-kind: identifier
      enum:
        - validation-failed
        - invalid-page-token
        - experimental-not-enabled
        - unauthenticated
        - forbidden
        - step-up-required
        - personal-keys-disabled
        - not-found
        - method-not-allowed
        - conflict
        - idempotency-in-progress
        - secret-already-issued
        - attention-already-resolved
        - project-managed-by-git
        - deprecated-removed
        - precondition-failed
        - payload-too-large
        - unsupported-media-type
        - idempotency-key-reused
        - precondition-required
        - rate-limited
        - internal-error
        - service-unavailable
        - confirmation-required
        - federated-token-rejected
        - csrf-check-failed
      x-orcon-problem-catalog:
        validation-failed:
          status: 400
          title: Validation failed
          when: A parameter or the body is invalid.
          retryable: false
        invalid-page-token:
          status: 400
          title: Invalid page token
          when: The page token is unknown or was issued for other parameters.
          retryable: false
        experimental-not-enabled:
          status: 400
          title: Experimental feature not enabled
          when: The operation is experimental and Orcon-Experimental does not name it.
          retryable: false
        unauthenticated:
          status: 401
          title: Unauthenticated
          when: No valid credential was sent.
          retryable: false
        forbidden:
          status: 403
          title: Forbidden
          when: The caller lacks the required permission.
          retryable: false
        step-up-required:
          status: 403
          title: Step-up required
          when: The operation needs a recent second factor.
          retryable: false
        personal-keys-disabled:
          status: 403
          title: Personal keys disabled
          when: The organization does not allow personal API keys.
          retryable: false
        not-found:
          status: 404
          title: Not found
          when: The resource does not exist or is not visible to the caller.
          retryable: false
        method-not-allowed:
          status: 405
          title: Method not allowed
          when: The path exists but the method is not one of its operations; the Allow header lists the methods that are.
          retryable: false
        conflict:
          status: 409
          title: Conflict
          when: The resource state does not allow the operation.
          retryable: false
        idempotency-in-progress:
          status: 409
          title: Idempotent request in progress
          when: A request with the same key is still running.
          retryable: true
        secret-already-issued:
          status: 409
          title: Secret already issued
          when: A replay asked again for a secret that is shown only once.
          retryable: false
        attention-already-resolved:
          status: 409
          title: Attention already resolved
          when: The human-attention item was already handled.
          retryable: false
        project-managed-by-git:
          status: 409
          title: Project managed by Git
          when: The project is bound to a Git repository so its flows change only through a Git sync.
          retryable: false
        deprecated-removed:
          status: 410
          title: Removed
          when: The operation was removed after its sunset date.
          retryable: false
        precondition-failed:
          status: 412
          title: Precondition failed
          when: If-Match does not match the current ETag.
          retryable: false
        payload-too-large:
          status: 413
          title: Payload too large
          when: The body exceeds the size limit.
          retryable: false
        unsupported-media-type:
          status: 415
          title: Unsupported media type
          when: The body is not in a media type the operation accepts.
          retryable: false
        idempotency-key-reused:
          status: 422
          title: Idempotency key reused
          when: The key was used with a different request.
          retryable: false
        precondition-required:
          status: 428
          title: Precondition required
          when: If-Match is missing.
          retryable: false
        rate-limited:
          status: 429
          title: Rate limited
          when: The rate class quota is exhausted.
          retryable: true
        internal-error:
          status: 500
          title: Internal error
          when: An unexpected server error happened.
          retryable: true
        service-unavailable:
          status: 503
          title: Service unavailable
          when: The server is starting, stopping or overloaded.
          retryable: true
        confirmation-required:
          status: 403
          title: Confirmation required
          when: The request was stored as a confirmation that a person must approve before it runs.
          retryable: false
        federated-token-rejected:
          status: 400
          title: Federated token rejected
          when: The workload identity token was rejected by the trust relationship; protocol endpoints send it as invalid_grant.
          retryable: false
        csrf-check-failed:
          status: 403
          title: CSRF check failed
          when: The request did not carry a valid CSRF token or came from another origin.
          retryable: false
    Project:
      type: object
      description: 'A project: the unit that owns flows, credentials and executions inside an organization.'
      required:
        - id
        - orgId
        - name
        - slug
        - handle
        - protected
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Id of the project.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
          readOnly: true
        orgId:
          type: string
          format: uuid
          description: Id of the organization that owns the project.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a71
        name:
          type: string
          description: Display name of the project.
          examples:
            - Customer onboarding
          maxLength: 200
        slug:
          type: string
          description: Short name that is unique inside the organization.
          examples:
            - onboarding
          maxLength: 100
        handle:
          type: string
          description: 'Identifier that is unique across the installation: the slug, or the organization slug and the slug when another project holds the slug.'
          examples:
            - onboarding
          maxLength: 201
        environment:
          type: string
          description: Free label of the environment the project stands for, for example dev, staging or prod; absent when there is none.
          examples:
            - prod
          maxLength: 100
        protected:
          type: boolean
          description: Whether the project is protected. Protected projects require confirmation for actions that change production behavior. New projects are protected.
        flowCount:
          type: integer
          description: Number of flows of the project that are not deleted. Present in lists of projects; absent in the answers that return one project.
          readOnly: true
          examples:
            - 4
          minimum: 0
        createdAt:
          type: string
          format: date-time
          description: When the project was created, in UTC.
          examples:
            - '2026-10-12T15:04:05Z'
        updatedAt:
          type: string
          format: date-time
          description: When the project last changed, in UTC.
          examples:
            - '2026-10-12T15:04:05Z'
    ProjectList:
      type: object
      description: One page of projects.
      required:
        - items
      properties:
        items:
          type: array
          description: The items of this page.
          items:
            $ref: '#/components/schemas/Project'
        nextPageToken:
          type: string
          description: Token for the next page; absent on the last page.
          examples:
            - example-page-token-2
          maxLength: 1024
    CreateProjectRequest:
      type: object
      description: Fields of a new project.
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          description: Display name of the project.
          examples:
            - Customer onboarding
          maxLength: 200
        slug:
          type: string
          description: Short name that is unique inside the organization; derived from the name when omitted.
          examples:
            - onboarding
          maxLength: 100
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        environment:
          type: string
          description: Free label of the environment, for example dev, staging or prod.
          examples:
            - prod
          maxLength: 100
        protected:
          type: boolean
          description: Whether the project is protected; defaults to true.
          default: true
    UpdateProjectRequest:
      type: object
      description: Fields of a project to change (JSON Merge Patch). Send null as the environment to remove the label.
      additionalProperties: false
      properties:
        name:
          type: string
          description: New display name of the project.
          examples:
            - Customer onboarding
          maxLength: 200
        environment:
          type:
            - string
            - 'null'
          description: New environment label, or null to remove it.
          examples:
            - staging
          maxLength: 100
        protected:
          type: boolean
          description: Whether the project is protected. Lowering the protection is audited.
    Flow:
      type: object
      description: 'A flow of a project: an automation with one editable draft and immutable published versions.'
      required:
        - id
        - projectId
        - name
        - activationState
        - hasUnpublishedChanges
        - draftRevision
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Id of the flow.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
          readOnly: true
        projectId:
          type: string
          format: uuid
          description: Id of the project that owns the flow.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
        name:
          type: string
          description: Display name of the flow; unique among the flows of the project.
          examples:
            - Welcome email
          maxLength: 200
        activationState:
          type: string
          description: Whether the automatic triggers of the flow are on.
          enum:
            - ACTIVE
            - INACTIVE
          examples:
            - INACTIVE
        activeVersion:
          type: integer
          description: Number of the version new executions use; absent until the first publication.
          examples:
            - 3
          minimum: 1
        hasUnpublishedChanges:
          type: boolean
          description: Whether the draft differs from the active version.
        draftRevision:
          type: integer
          description: Revision number of the draft, the value of its ETag.
          examples:
            - 7
          minimum: 0
        lastExecution:
          description: The most recent execution of the flow. Present only in lists of flows, where it is read with the flow; absent in the answers that return one flow, and when the flow never ran.
          readOnly: true
          $ref: '#/components/schemas/FlowLastExecution'
        executionCountLast24h:
          type: integer
          description: Number of executions of the flow accepted in the last 24 hours. Present only in lists of flows.
          readOnly: true
          examples:
            - 12
          minimum: 0
        createdAt:
          type: string
          format: date-time
          description: When the flow was created, in UTC.
          examples:
            - '2026-10-12T15:04:05Z'
        updatedAt:
          type: string
          format: date-time
          description: When the flow last changed, in UTC.
          examples:
            - '2026-10-12T15:04:05Z'
    FlowList:
      type: object
      description: One page of flows.
      required:
        - items
      properties:
        items:
          type: array
          description: The items of this page.
          items:
            $ref: '#/components/schemas/Flow'
        nextPageToken:
          type: string
          description: Token for the next page; absent on the last page.
          examples:
            - example-page-token-2
          maxLength: 1024
    FlowLastExecution:
      type: object
      description: 'The most recent execution of a flow: enough to show its status in a list without reading the execution.'
      required:
        - id
        - status
        - hasUncertainOperation
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Id of the execution.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a64
          readOnly: true
        status:
          type: string
          description: Progress of the execution, the same values as the execution status.
          enum:
            - QUEUED
            - RUNNING
            - WAITING
            - SUSPENDED
            - CANCELING
            - COMPENSATING
            - SUCCEEDED
            - FAILED
            - CANCELED
          examples:
            - SUCCEEDED
        hasUncertainOperation:
          type: boolean
          description: True when the execution has an external operation whose outcome is unknown and a person must review it.
        createdAt:
          type: string
          format: date-time
          description: When the execution was accepted, in UTC.
          examples:
            - '2026-10-12T15:04:05Z'
        finishedAt:
          type: string
          format: date-time
          description: When the execution reached a final status, in UTC; absent before that.
          examples:
            - '2026-10-12T15:04:09Z'
    CreateFlowRequest:
      type: object
      description: Fields of a new flow.
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          description: Display name of the flow; unique among the flows of the project.
          examples:
            - Welcome email
          maxLength: 200
    UpdateFlowRequest:
      type: object
      description: Fields of a flow to change (JSON Merge Patch).
      additionalProperties: false
      properties:
        name:
          type: string
          description: New display name of the flow.
          examples:
            - Welcome email v2
          maxLength: 200
    FlowDocument:
      type: object
      description: 'A flow document in the orcon/flow@1 format, stored and returned as it is. The canonical JSON Schema is internal/adapter/codec/flowjson/schema/orcon-flow-1.schema.json and the format, its node types and its static rules are described in docs/reference/orcon-flow-1.md. This schema is deliberately open: the server validates every document with that schema and the static rules and answers validation-failed with a JSON Pointer for each problem. A document has at most 2000 nodes and 10000 edges.'
      required:
        - format
        - nodes
        - edges
      additionalProperties: {}
      properties:
        format:
          type: string
          description: Identifier and version of the document format.
          enum:
            - orcon/flow@1
          x-orcon-enum-kind: identifier
        id:
          type: string
          format: uuid
          description: Id of the document, kept across drafts and versions.
          examples:
            - 01930000-0000-7000-8000-00000000000a
        name:
          type: string
          description: Name of the flow as written in the document.
          examples:
            - Welcome email
          maxLength: 200
        nodes:
          type: array
          description: 'The nodes of the flow: events, tasks, gateways and calls.'
          maxItems: 2000
          items:
            type: object
            description: One node of the flow.
            additionalProperties: {}
        edges:
          type: array
          description: The connections between nodes.
          maxItems: 10000
          items:
            type: object
            description: One edge of the flow.
            additionalProperties: {}
    ValidationIssue:
      type: object
      description: One finding of the static validation of a flow document (ADR-0007 section 9).
      required:
        - severity
        - code
        - path
        - message
      properties:
        severity:
          type: string
          description: ERROR blocks publication; WARNING is shown and stored with the version.
          enum:
            - ERROR
            - WARNING
          examples:
            - ERROR
        code:
          type: string
          description: Name of the rule that found the issue, for example V8 or REFERENCE.
          examples:
            - REFERENCE
          maxLength: 100
        path:
          type: string
          description: JSON Pointer to the offending part of the document.
          examples:
            - /edges/1/to/node
          maxLength: 2048
        message:
          type: string
          description: Explanation for a person.
          examples:
            - The edge points at a node that does not exist.
          maxLength: 1000
    ValidationResult:
      type: object
      description: The outcome of validating the draft of a flow.
      required:
        - valid
        - draftRevision
        - issues
      properties:
        valid:
          type: boolean
          description: True when there is no issue with severity ERROR, so the draft can be published.
        draftRevision:
          type: integer
          description: Revision of the draft that was validated.
          examples:
            - 7
          minimum: 0
        issues:
          type: array
          description: Every issue found, errors first.
          items:
            $ref: '#/components/schemas/ValidationIssue'
    FlowDraft:
      type: object
      description: The editable draft of a flow.
      required:
        - flowId
        - revision
        - document
        - updatedAt
      properties:
        flowId:
          type: string
          format: uuid
          description: Id of the flow the draft belongs to.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
        revision:
          type: integer
          description: Revision number of the draft; it is the value of the ETag.
          examples:
            - 7
          minimum: 0
        document:
          $ref: '#/components/schemas/FlowDocument'
          description: The flow document.
        updatedAt:
          type: string
          format: date-time
          description: When the draft last changed, in UTC.
          examples:
            - '2026-10-12T15:04:05Z'
        updatedBy:
          type: string
          format: uuid
          description: Id of the principal that saved the stored revision; absent when unknown.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a61
    ReplaceDraftRequest:
      type: object
      description: The new content of a draft.
      required:
        - document
      additionalProperties: false
      properties:
        document:
          $ref: '#/components/schemas/FlowDocument'
          description: The complete flow document that replaces the draft.
    JsonPatchOperation:
      type: object
      description: One operation of a JSON Patch (RFC 6902).
      required:
        - op
        - path
      additionalProperties: false
      properties:
        op:
          type: string
          description: What to do. A test operation that fails stops the whole patch and changes nothing.
          enum:
            - add
            - remove
            - replace
            - move
            - copy
            - test
          examples:
            - replace
          x-orcon-enum-kind: identifier
        path:
          type: string
          description: JSON Pointer of the part of the draft document the operation applies to.
          examples:
            - /name
          maxLength: 2048
        from:
          type: string
          description: JSON Pointer of the source, for move and copy.
          examples:
            - /nodes/0
          maxLength: 2048
        value:
          description: The value for add, replace and test.
    JsonPatch:
      type: array
      description: A JSON Patch (RFC 6902) applied to the draft document. Put a test operation first to make the patch depend on a value you read.
      maxItems: 1000
      items:
        $ref: '#/components/schemas/JsonPatchOperation'
    FlowVersion:
      type: object
      description: An immutable published version of a flow.
      required:
        - flowId
        - version
        - contentHash
        - publishedAt
        - warnings
      properties:
        flowId:
          type: string
          format: uuid
          description: Id of the flow.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
        version:
          type: integer
          description: Version number, starting at 1.
          examples:
            - 3
          minimum: 1
        contentHash:
          type: string
          description: Hash of the document of the version; two versions with the same hash have the same content.
          examples:
            - sha256:4f2a9c0d7e8b1a36c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f00112233445566778
          maxLength: 128
          x-orcon-volatile: true
        publishedAt:
          type: string
          format: date-time
          description: When the version was published, in UTC.
          examples:
            - '2026-10-12T15:04:05Z'
        publishedBy:
          type: string
          format: uuid
          description: Id of the principal that published the version; absent when the principal was deleted.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a61
        note:
          type: string
          description: Release note given at publication.
          examples:
            - Retry the CRM step on rate limits
          maxLength: 500
        rolledBackFromVersion:
          type: integer
          description: When the version came from a rollback, the number of the version whose content it repeats.
          examples:
            - 1
          minimum: 1
        gitCommit:
          type: string
          description: Commit that holds the version when the project is bound to Git.
          examples:
            - 9f3c2a1b7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a
          maxLength: 64
        warnings:
          type: array
          description: The warnings stored with the version; empty when there are none.
          items:
            $ref: '#/components/schemas/ValidationIssue'
        document:
          $ref: '#/components/schemas/FlowDocument'
          description: The document of the version. It is present only when you read one version.
    FlowVersionList:
      type: object
      description: One page of flow versions, without their documents.
      required:
        - items
      properties:
        items:
          type: array
          description: The items of this page.
          items:
            $ref: '#/components/schemas/FlowVersion'
        nextPageToken:
          type: string
          description: Token for the next page; absent on the last page.
          examples:
            - example-page-token-2
          maxLength: 1024
    PublishFlowRequest:
      type: object
      description: Options for publishing a flow draft.
      additionalProperties: false
      properties:
        note:
          type: string
          description: Release note stored with the version.
          examples:
            - Retry the CRM step on rate limits
          maxLength: 500
    RollbackFlowRequest:
      type: object
      description: Which earlier version to make current.
      required:
        - version
      additionalProperties: false
      properties:
        version:
          type: integer
          description: Number of the earlier version whose content is published again as a new version.
          examples:
            - 1
          minimum: 1
        note:
          type: string
          description: Release note stored with the new version.
          examples:
            - Back to the version before the pricing change
          maxLength: 500
    ExecutionFailure:
      type: object
      description: How an execution or a node execution failed. It is present only when the status is FAILED.
      required:
        - code
        - title
      properties:
        code:
          type: string
          description: Error code of the engine or of the node, an identifier such as NodeTimeout.
          examples:
            - NodeTimeout
          maxLength: 100
        title:
          type: string
          description: Short summary of the failure.
          examples:
            - The node timed out
          maxLength: 200
        detail:
          type: string
          description: Sanitized explanation of the failure.
          examples:
            - The node did not answer within 30 seconds.
          maxLength: 2000
        nodeId:
          type: string
          description: Id of the node where the failure happened, as written in the flow document.
          examples:
            - greeting
          maxLength: 255
          x-orcon-external-id: true
    Execution:
      type: object
      description: One execution of a flow version.
      required:
        - id
        - flowId
        - projectId
        - mode
        - status
        - createdAt
        - hasUncertainOperation
        - dataHidden
      properties:
        id:
          type: string
          format: uuid
          description: Id of the execution.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a64
          readOnly: true
        flowId:
          type: string
          format: uuid
          description: Id of the flow that ran.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
        projectId:
          type: string
          format: uuid
          description: Id of the project that owns the flow.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
        flowVersion:
          type: integer
          description: Number of the flow version the execution runs; it never changes. Absent for an execution that runs a snapshot of a draft (a test run), which has no version number.
          examples:
            - 3
          minimum: 1
        hasUncertainOperation:
          type: boolean
          description: True when an external operation of the execution has an outcome that is unknown, so a person must review it (the "Needs review" state).
          readOnly: true
        mode:
          type: string
          description: How the execution started.
          enum:
            - WEBHOOK
            - TRIGGER
            - TEST
            - MANUAL
            - CHILD
            - ERROR
            - RETRY
            - EVALUATION
          examples:
            - MANUAL
        status:
          type: string
          description: Progress of the execution.
          enum:
            - QUEUED
            - RUNNING
            - WAITING
            - SUSPENDED
            - CANCELING
            - COMPENSATING
            - SUCCEEDED
            - FAILED
            - CANCELED
          examples:
            - SUCCEEDED
        createdAt:
          type: string
          format: date-time
          description: When the execution was accepted, in UTC.
          examples:
            - '2026-10-12T15:04:05Z'
        startedAt:
          type: string
          format: date-time
          description: When the execution started to run, in UTC; absent while it is queued.
          examples:
            - '2026-10-12T15:04:05Z'
        finishedAt:
          type: string
          format: date-time
          description: When the execution reached a final status, in UTC; absent before that.
          examples:
            - '2026-10-12T15:04:09Z'
        retryOfExecutionId:
          type: string
          format: uuid
          description: Id of the execution this one retries; absent for a first run.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a65
        failure:
          $ref: '#/components/schemas/ExecutionFailure'
          description: Why the execution failed; absent unless the status is FAILED.
        dataHidden:
          type: boolean
          description: True when the output summary is left out because the caller lacks the execution:read-data permission.
        output:
          type: object
          description: 'Summary of the output of the execution: the items of the last node. Present only when the caller has the execution:read-data permission and the execution finished.'
          x-orcon-data: protected
          additionalProperties: {}
    ExecutionList:
      type: object
      description: One page of executions.
      required:
        - items
      properties:
        items:
          type: array
          description: The items of this page.
          items:
            $ref: '#/components/schemas/Execution'
        nextPageToken:
          type: string
          description: Token for the next page; absent on the last page.
          examples:
            - example-page-token-2
          maxLength: 1024
    CreateExecutionRequest:
      type: object
      description: Options for running a flow by hand.
      additionalProperties: false
      properties:
        input:
          type: array
          description: Items the first node receives, each a JSON object. Omit it to start with one empty item.
          maxItems: 100
          items:
            type: object
            description: One input item.
            additionalProperties: {}
    NodeExecution:
      type: object
      description: One run of one node inside an execution.
      required:
        - id
        - executionId
        - nodeId
        - status
        - attemptCount
      properties:
        id:
          type: string
          format: uuid
          description: Id of the node execution.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a66
          readOnly: true
        executionId:
          type: string
          format: uuid
          description: Id of the execution the node ran in.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a64
        nodeId:
          type: string
          description: Id of the node as written in the flow document.
          examples:
            - greeting
          maxLength: 255
          x-orcon-external-id: true
        status:
          type: string
          description: Progress of the node execution.
          enum:
            - RUNNING
            - WAITING
            - SUCCEEDED
            - SUCCEEDED_WITH_ERRORS
            - FAILED
            - SUSPENDED
            - CANCELED
          examples:
            - SUCCEEDED
        attemptCount:
          type: integer
          description: Number of attempts made, retries included.
          examples:
            - 1
          minimum: 0
          x-orcon-volatile: true
        startedAt:
          type: string
          format: date-time
          description: When the node started to run, in UTC.
          examples:
            - '2026-10-12T15:04:05Z'
        finishedAt:
          type: string
          format: date-time
          description: When the node reached a final status, in UTC.
          examples:
            - '2026-10-12T15:04:09Z'
        failure:
          $ref: '#/components/schemas/ExecutionFailure'
          description: Why the node failed; absent unless the status is FAILED.
    NodeExecutionList:
      type: object
      description: One page of node executions.
      required:
        - items
      properties:
        items:
          type: array
          description: The items of this page.
          items:
            $ref: '#/components/schemas/NodeExecution'
        nextPageToken:
          type: string
          description: Token for the next page; absent on the last page.
          examples:
            - example-page-token-2
          maxLength: 1024
    ExecutionEvent:
      type: object
      description: One event of the history of an execution (ADR-0009 section 8).
      required:
        - sequenceNumber
        - type
        - occurredAt
      properties:
        sequenceNumber:
          type: integer
          description: Position of the event in the history of the execution; it only grows.
          examples:
            - 12
          minimum: 1
        type:
          type: string
          description: Event type, an identifier such as node.succeeded.
          examples:
            - node.succeeded
          maxLength: 100
        occurredAt:
          type: string
          format: date-time
          description: When the event happened, in UTC.
          examples:
            - '2026-10-12T15:04:05Z'
        nodeId:
          type: string
          description: Id of the node the event is about, when there is one.
          examples:
            - greeting
          maxLength: 255
          x-orcon-external-id: true
        edgeId:
          type: string
          description: Id of the edge the event is about, when there is one.
          examples:
            - e1
          maxLength: 255
          x-orcon-external-id: true
        detail:
          type: string
          description: Short description of the event without execution data.
          examples:
            - Attempt 1 finished.
          maxLength: 1000
    ExecutionEventList:
      type: object
      description: One page of execution events.
      required:
        - items
      properties:
        items:
          type: array
          description: The items of this page.
          items:
            $ref: '#/components/schemas/ExecutionEvent'
        nextPageToken:
          type: string
          description: Token for the next page; absent on the last page.
          examples:
            - example-page-token-2
          maxLength: 1024
    ExecutionDataEntry:
      type: object
      description: The items one node received or produced in an execution, for one port.
      required:
        - nodeExecutionId
        - nodeId
        - side
        - port
        - itemCount
        - dataItems
      properties:
        nodeExecutionId:
          type: string
          format: uuid
          description: Id of the node execution the items belong to.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a66
        nodeId:
          type: string
          description: Id of the node as written in the flow document.
          examples:
            - greeting
          maxLength: 255
          x-orcon-external-id: true
        side:
          type: string
          description: INPUT for what the node received, OUTPUT for what it produced.
          enum:
            - INPUT
            - OUTPUT
          examples:
            - OUTPUT
        port:
          type: string
          description: Name of the port, for example main.
          examples:
            - main
          maxLength: 100
        itemCount:
          type: integer
          description: Number of items on the port.
          examples:
            - 1
          minimum: 0
        dataItems:
          type: array
          description: The items, each a JSON object. Secrets and masked fields are replaced by their mask.
          x-orcon-data: protected
          maxItems: 200
          items:
            type: object
            description: One item.
            additionalProperties: {}
    ExecutionDataList:
      type: object
      description: One page of execution data entries.
      required:
        - items
      properties:
        items:
          type: array
          description: The items of this page.
          items:
            $ref: '#/components/schemas/ExecutionDataEntry'
        nextPageToken:
          type: string
          description: Token for the next page; absent on the last page.
          examples:
            - example-page-token-2
          maxLength: 1024
    TestSession:
      type: object
      description: A short window in which the test addresses of the draft of a flow are live.
      required:
        - id
        - flowId
        - status
        - draftRevision
        - eventCount
        - maximumEventCount
        - addresses
        - createdAt
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
          description: Id of the test session.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a69
          readOnly: true
        flowId:
          type: string
          format: uuid
          description: Id of the flow under test.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
        status:
          type: string
          description: ACTIVE while the addresses are live; COMPLETED when the event limit was reached; EXPIRED when the time ran out or the session was canceled.
          enum:
            - ACTIVE
            - COMPLETED
            - EXPIRED
          examples:
            - ACTIVE
        draftRevision:
          type: integer
          description: Revision of the draft the session tests.
          examples:
            - 7
          minimum: 0
        eventCount:
          type: integer
          description: Events received so far.
          examples:
            - 0
          minimum: 0
        maximumEventCount:
          type: integer
          description: Events after which the session completes.
          examples:
            - 1
          minimum: 1
        addresses:
          type: array
          description: The live test addresses, one per trigger that has one.
          items:
            $ref: '#/components/schemas/TestSessionAddress'
        createdAt:
          type: string
          format: date-time
          description: When the session opened, in UTC.
          examples:
            - '2026-10-12T15:04:05Z'
        expiresAt:
          type: string
          format: date-time
          description: When the session expires, in UTC.
          examples:
            - '2026-10-12T15:06:05Z'
    TestSessionAddress:
      type: object
      description: A live test address of a trigger node.
      required:
        - nodeId
        - url
      properties:
        nodeId:
          type: string
          description: Id of the trigger node as written in the flow document.
          examples:
            - start
          maxLength: 255
          x-orcon-external-id: true
        url:
          type: string
          format: uri
          description: The address that starts a test execution of the draft while the session is active.
          examples:
            - https://orcon.example.com/webhook-test/welcome
    CreateTestSessionRequest:
      type: object
      description: Options for a test session.
      additionalProperties: false
      properties:
        expiresInSeconds:
          type: integer
          description: How long the test addresses stay live; at most 10 minutes.
          examples:
            - 120
          minimum: 1
          maximum: 600
          default: 120
        maximumEventCount:
          type: integer
          description: How many events the session accepts before it completes.
          examples:
            - 1
          minimum: 1
          maximum: 100
          default: 1
    ExternalOperation:
      type: object
      description: An external operation of an execution that the journal tracks (ADR-0012).
      required:
        - id
        - executionId
        - nodeExecutionId
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Id of the external operation.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a67
          readOnly: true
        executionId:
          type: string
          format: uuid
          description: Id of the execution that made the call.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a64
        nodeExecutionId:
          type: string
          format: uuid
          description: Id of the node execution that made the call.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a66
        status:
          type: string
          description: State in the journal. UNCERTAIN means the outcome is not known and a person must resolve it.
          enum:
            - PREPARED
            - DISPATCHING
            - VERIFYING
            - SUCCEEDED
            - FAILED
            - UNCERTAIN
            - NOT_DISPATCHED
            - RESOLVED_SUCCEEDED
            - RESOLVED_FAILED
          examples:
            - RESOLVED_SUCCEEDED
        resolvedBy:
          type: string
          format: uuid
          description: Id of the principal that resolved the operation; absent while it is not resolved.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a61
        resolvedAt:
          type: string
          format: date-time
          description: When the operation was resolved, in UTC.
          examples:
            - '2026-10-12T15:04:09Z'
    ResolveExternalOperationRequest:
      type: object
      description: How to close an uncertain external operation.
      required:
        - resolution
      additionalProperties: false
      properties:
        resolution:
          type: string
          description: VERIFY_AGAIN asks the connector to check the outcome again; MARK_SUCCEEDED records that the operation happened; MARK_FAILED_AND_REPEAT records that it did not happen and sends it again; CANCEL_EXECUTION stops the execution.
          enum:
            - VERIFY_AGAIN
            - MARK_SUCCEEDED
            - MARK_FAILED_AND_REPEAT
            - CANCEL_EXECUTION
          examples:
            - MARK_SUCCEEDED
        evidence:
          type: string
          description: What you checked, for the audit log; required for MARK_SUCCEEDED and MARK_FAILED_AND_REPEAT.
          examples:
            - 'Checked in the CRM: contact 4711 exists and has the welcome tag.'
          maxLength: 2048
        acceptRisk:
          type: boolean
          description: Confirms that you accept the risk of MARK_SUCCEEDED; accepting a risk is never proof that the operation happened.
        acknowledgeDuplicate:
          type: boolean
          description: Confirms that you know MARK_FAILED_AND_REPEAT can duplicate an effect that did happen.
    HumanTask:
      type: object
      description: A task that waits for a person (a form or an approval).
      required:
        - id
        - executionId
        - nodeId
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Id of the human task.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a68
          readOnly: true
        executionId:
          type: string
          format: uuid
          description: Id of the execution that waits.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a64
        nodeId:
          type: string
          description: Id of the node as written in the flow document.
          examples:
            - approve
          maxLength: 255
          x-orcon-external-id: true
        status:
          type: string
          description: OPEN while it waits; COMPLETED once someone submitted a result; CANCELED when the execution stopped.
          enum:
            - OPEN
            - COMPLETED
            - CANCELED
          examples:
            - COMPLETED
        completedBy:
          type: string
          format: uuid
          description: Id of the principal that completed the task; absent while it is open.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a61
        completedAt:
          type: string
          format: date-time
          description: When the task was completed, in UTC.
          examples:
            - '2026-10-12T15:04:09Z'
    CompleteHumanTaskRequest:
      type: object
      description: The result a person submits for a human task.
      required:
        - outcome
      additionalProperties: false
      properties:
        outcome:
          type: string
          description: 'The decision: APPROVED or REJECTED for an approval, SUBMITTED for a form.'
          enum:
            - APPROVED
            - REJECTED
            - SUBMITTED
          examples:
            - APPROVED
        result:
          type: object
          description: The form values, as the form schema of the task defines them.
          x-orcon-data: protected
          additionalProperties: {}
        note:
          type: string
          description: Optional comment kept with the task.
          examples:
            - Looks good.
          maxLength: 2048
    NodeTypeOperation:
      type: object
      description: One operation of a node type.
      required:
        - name
        - label
        - purity
        - safetyLevel
      properties:
        name:
          type: string
          description: Name of the operation, resource.verb.
          examples:
            - contact.create
          maxLength: 200
        label:
          type: string
          description: Name shown to people, in the language of the request.
          examples:
            - Create a contact
          maxLength: 200
        purity:
          type: string
          description: 'Purity class of the operation: PURE derives its output from its inputs, READ reads from outside without effects, EFFECT changes the outside world, INTERNAL_EFFECT changes Orcon state, AGENTIC is a stepped node with its own durable state.'
          enum:
            - PURE
            - READ
            - EFFECT
            - INTERNAL_EFFECT
            - AGENTIC
          examples:
            - EFFECT
        safetyLevel:
          type: string
          description: How an EFFECT operation is protected against running twice or with an unknown outcome; NONE for the other purity classes.
          enum:
            - NONE
            - IDEMPOTENCY_KEY
            - RECONCILE
            - UNSAFE
          examples:
            - IDEMPOTENCY_KEY
    NodeType:
      type: object
      description: A node type a flow of the project can use, built in or provided by an installed connector.
      required:
        - type
        - name
        - description
        - group
        - seal
        - proofLevel
        - operations
        - n8nTypes
      properties:
        type:
          type: string
          description: Identifier of the node type as written in flow documents.
          examples:
            - orcon.http@1
          maxLength: 255
        name:
          type: string
          description: Name shown to people, in the language of the request.
          examples:
            - HTTP request
          maxLength: 200
        description:
          type: string
          description: What the node type does, in the language of the request.
          examples:
            - Calls an HTTP endpoint and returns the response.
          maxLength: 1000
        group:
          type: string
          description: Palette group the node type belongs to.
          examples:
            - Core
          maxLength: 100
        seal:
          type: string
          description: Review seal of the connector that provides the type; built-in types are OFFICIAL.
          enum:
            - OFFICIAL
            - VERIFIED
            - UNREVIEWED
          examples:
            - OFFICIAL
        proofLevel:
          type: string
          description: How far the safety contracts of the operations are proven.
          enum:
            - DECLARED
            - TESTED
            - VERIFIED
          examples:
            - TESTED
        connectorId:
          type: string
          format: uuid
          description: Id of the installed connector that provides the type; absent for built-in types.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a6a
        icon:
          $ref: '#/components/schemas/NodeTypeIcon'
        operations:
          type: array
          description: The operations of the type with their purity and safety level.
          items:
            $ref: '#/components/schemas/NodeTypeOperation'
        n8nTypes:
          type: array
          description: The n8n node types this type replaces when a flow is imported.
          items:
            type: string
            description: An n8n node type name.
            examples:
              - n8n-nodes-base.httpRequest
            maxLength: 255
    NodeTypeIcon:
      type: object
      description: 'The brand icon of a node type, inline. The markup is sanitized when the connector is loaded: no scripts, no event attributes, no external references. The client shows it through an img element only.'
      required:
        - svg
        - source
      properties:
        svg:
          type: string
          description: The icon of the service in its official colour, as an SVG document of at most 8 KiB.
          maxLength: 8192
          examples:
            - <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20z"/></svg>
        darkSvg:
          type: string
          description: The variant the brand itself publishes for dark backgrounds, same limits as svg. Absent unless the brand publishes one.
          examples:
            - <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#FFFFFF" d="M1 1h22v22H1z"/></svg>
          maxLength: 8192
        source:
          type: string
          description: Where the icon came from, one line such as simple-icons@16.35.0:whatsapp, brand-kit:<url> or orcon-fallback.
          examples:
            - simple-icons@16.35.0:whatsapp
          maxLength: 300
    NodeTypeList:
      type: object
      description: One page of node types.
      required:
        - items
      properties:
        items:
          type: array
          description: The items of this page.
          items:
            $ref: '#/components/schemas/NodeType'
        nextPageToken:
          type: string
          description: Token for the next page; absent on the last page.
          examples:
            - example-page-token-2
          maxLength: 1024
    Credential:
      type: object
      description: 'A credential: the secret settings a project keeps to call an outside service. Secret fields are never returned; the secret object tells whether one is set and when and by whom it was last written.'
      required:
        - id
        - projectId
        - owned
        - name
        - type
        - status
        - allowedHosts
        - versionCount
        - secret
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Id of the credential.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a90
          readOnly: true
        projectId:
          type: string
          format: uuid
          description: Id of the project that owns the credential.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
        owned:
          type: boolean
          description: Whether the project the list belongs to owns the credential. A credential shared with the project can be used by its flows but only the owning project can change it.
        name:
          type: string
          description: Name of the credential, unique inside the owning project.
          examples:
            - Slack notifications
          maxLength: 100
        type:
          type: string
          description: Connector reference of the credential type, for example the connector the secret serves.
          examples:
            - orcon.http@1
          maxLength: 255
        status:
          type: string
          description: OK when the credential can be used. NEEDS_SECRET means a value is missing, NEEDS_REAUTH means an OAuth grant must be given again, DISABLED means the owner switched it off.
          enum:
            - OK
            - NEEDS_SECRET
            - NEEDS_REAUTH
            - DISABLED
          x-orcon-enum-kind: identifier
          examples:
            - OK
        allowedHosts:
          type: array
          description: Hosts the secret may be sent to. A request to any other host never receives the secret. An entry may start with one wildcard label, for example *.example.com.
          maxItems: 50
          items:
            type: string
            maxLength: 253
            examples:
              - hooks.slack.com
        versionCount:
          type: integer
          description: Number of versions of the secret. Replacing the secret adds one.
          minimum: 1
          examples:
            - 2
        secret:
          $ref: '#/components/schemas/CredentialSecret'
        publicFields:
          type: object
          description: Non-secret fields of the current version, by field name. Present when a single credential is returned; absent from list items.
          additionalProperties:
            type: string
            maxLength: 4096
          examples:
            - region: eu-west-1
        createdAt:
          type: string
          format: date-time
          description: When the credential was created, in UTC.
          examples:
            - '2026-10-12T15:04:05Z'
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: When the credential last changed, in UTC. Changing the secret also changes it.
          examples:
            - '2026-10-12T15:04:05Z'
          readOnly: true
    CredentialSecret:
      type: object
      description: What a reader learns about the secret of a credential. The value itself is never returned, to anyone.
      required:
        - set
      properties:
        set:
          type: boolean
          description: Whether a secret value is stored.
          examples:
            - true
        updatedAt:
          type: string
          format: date-time
          description: When the secret was last written, in UTC; absent when no secret is set.
          examples:
            - '2026-10-12T15:04:05Z'
        updatedBy:
          type: string
          format: uuid
          description: Id of the principal that last wrote the secret; absent when no secret is set.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a91
    CredentialList:
      type: object
      description: One page of credentials.
      required:
        - items
      properties:
        items:
          type: array
          description: The items of this page.
          items:
            $ref: '#/components/schemas/Credential'
        nextPageToken:
          type: string
          description: Token for the next page; absent on the last page.
          examples:
            - example-page-token-2
          maxLength: 1024
    CreateCredentialRequest:
      type: object
      description: Fields of a new credential. Secret field values are stored and never returned.
      required:
        - name
        - type
        - secretFields
      additionalProperties: false
      properties:
        name:
          type: string
          description: Name of the credential, unique inside the project.
          examples:
            - Slack notifications
          maxLength: 100
        type:
          type: string
          description: Connector reference of the credential type.
          examples:
            - orcon.http@1
          maxLength: 255
        allowedHosts:
          type: array
          description: Hosts the secret may be sent to; empty means none until you add some.
          maxItems: 50
          items:
            type: string
            maxLength: 253
            examples:
              - hooks.slack.com
        publicFields:
          type: object
          description: Non-secret fields, by field name.
          maxProperties: 64
          additionalProperties:
            type: string
            maxLength: 4096
          examples:
            - region: eu-west-1
        secretFields:
          type: object
          description: 'Secret fields, by field name. Write-only: they are stored encrypted and never returned. At least one field is required.'
          minProperties: 1
          maxProperties: 64
          additionalProperties:
            type: string
            maxLength: 65536
          examples:
            - token: xoxb-example-value
    UpdateCredentialRequest:
      type: object
      description: Fields of a credential to change (JSON Merge Patch). The secret is changed with replaceCredentialSecret.
      additionalProperties: false
      properties:
        name:
          type: string
          description: New name of the credential.
          examples:
            - Slack alerts
          maxLength: 100
        allowedHosts:
          type: array
          description: New list of hosts the secret may be sent to; replaces the previous list.
          maxItems: 50
          items:
            type: string
            maxLength: 253
            examples:
              - hooks.slack.com
    ReplaceCredentialSecretRequest:
      type: object
      description: 'The new version of a credential: its secret fields and, optionally, its public fields. The new version becomes current; earlier versions are kept. When publicFields is absent the public fields of the current version are kept.'
      required:
        - secretFields
      additionalProperties: false
      properties:
        publicFields:
          type: object
          description: Non-secret fields of the new version, by field name.
          maxProperties: 64
          additionalProperties:
            type: string
            maxLength: 4096
          examples:
            - region: eu-west-1
        secretFields:
          type: object
          description: Secret fields of the new version. Write-only, as in the creation.
          minProperties: 1
          maxProperties: 64
          additionalProperties:
            type: string
            maxLength: 65536
          examples:
            - token: xoxb-rotated-example-value
    ShareCredentialRequest:
      type: object
      description: The project that may use the credential. Sharing gives use without read.
      required:
        - projectId
      additionalProperties: false
      properties:
        projectId:
          type: string
          format: uuid
          description: Id of the project that may use the credential; it must belong to the same organization.
          examples:
            - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a77
  responses:
    ValidationFailed:
      description: A parameter or the body is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: No valid credential was sent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CsrfCheckFailed:
      description: The request did not carry a valid CSRF token or came from another origin.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller lacks the required permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The resource state does not allow the operation, or an identical request is still running.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match does not match the current ETag.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The body exceeds the size limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The body is not in a media type the operation accepts.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyKeyReused:
      description: The idempotency key was used with a different request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match is missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The rate class quota is exhausted.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: An unexpected server error happened.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: The operation is not available yet, or the server is starting, stopping or overloaded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

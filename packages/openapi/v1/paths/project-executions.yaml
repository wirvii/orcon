x-orcon-resource: collection
parameters:
  - $ref: ../openapi.yaml#/components/parameters/ProjectId
get:
  operationId: listExecutions
  summary: List the executions of a project
  description: >-
    Returns the executions of one project, newest first by default, one page at a time. Filter by flow
    or status to find the run you are looking for; the list holds metadata only and never execution data.
  tags:
    - executions
  x-orcon-permission: execution:read
  x-orcon-rate-class: read
  x-orcon-stability: stable
  x-orcon-audit: none
  x-orcon-problems:
    - invalid-page-token
    - validation-failed
    - unauthenticated
    - forbidden
    - not-found
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: executions list
  x-orcon-mcp:
    level: read
    tool: list_executions
    description: List the executions of a project, filtered by flow or status.
  x-orcon-examples:
    - name: recentExecutions
      scenario: execution-succeeded
      request:
        pathParams:
          projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
        query:
          flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
      response:
        status: 200
        body: recentExecutions
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/Limit
    - $ref: ../openapi.yaml#/components/parameters/PageToken
    - name: sort
      in: query
      required: false
      description: Sort expression; a leading minus sorts in descending order.
      x-orcon-sort-default: -createdAt
      schema:
        type: string
        enum:
          - createdAt
          - -createdAt
        x-orcon-enum-kind: identifier
        default: -createdAt
    - name: flowId
      in: query
      required: false
      description: Return only executions of this flow.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
    - name: status
      in: query
      required: false
      description: Return only executions in this status.
      schema:
        type: string
        enum:
          - QUEUED
          - RUNNING
          - WAITING
          - SUSPENDED
          - CANCELING
          - COMPENSATING
          - SUCCEEDED
          - FAILED
          - CANCELED
    - name: createdAfter
      in: query
      required: false
      description: Return only executions accepted after this instant.
      schema:
        type: string
        format: date-time
        examples:
          - '2026-10-12T15:04:05Z'
    - name: createdBefore
      in: query
      required: false
      description: Return only executions accepted before this instant.
      schema:
        type: string
        format: date-time
        examples:
          - '2026-10-12T15:10:00Z'
  responses:
    '200':
      description: One page of executions.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ExecutionList
          examples:
            recentExecutions:
              summary: One finished execution
              value:
                items:
                  - id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a64
                    flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
                    projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                    flowVersion: 1
                    mode: MANUAL
                    status: SUCCEEDED
                    createdAt: '2026-10-12T15:04:05Z'
                    startedAt: '2026-10-12T15:04:05Z'
                    finishedAt: '2026-10-12T15:04:09Z'
                    dataHidden: false
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable

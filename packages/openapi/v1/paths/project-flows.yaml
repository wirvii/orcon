x-orcon-resource: collection
parameters:
  - $ref: ../openapi.yaml#/components/parameters/ProjectId
get:
  operationId: listFlows
  summary: List the flows of a project
  description: >-
    Returns the flows of one project, one page at a time, ordered by the sort expression. Use the filters
    to narrow the list and pass nextPageToken back as pageToken to read the next page; the list never
    includes flows of other projects.
  tags:
    - flows
  x-orcon-permission: flow:read
  x-orcon-rate-class: read
  x-orcon-stability: stable
  x-orcon-audit: none
  x-orcon-problems:
    - invalid-page-token
    - validation-failed
    - unauthenticated
    - forbidden
    - not-found
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: flows list
  x-orcon-mcp:
    level: read
    tool: search_flows
    description: Search the flows of a project by name prefix or activation state.
  x-orcon-examples:
    - name: firstPageOfFlows
      scenario: project-with-flows
      request:
        pathParams:
          projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
        query:
          sort: -name
      response:
        status: 200
        body: firstPageOfFlows
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/Limit
    - $ref: ../openapi.yaml#/components/parameters/PageToken
    - name: sort
      in: query
      required: false
      description: Sort expression; a leading minus sorts in descending order.
      x-orcon-sort-default: -updatedAt
      schema:
        type: string
        enum:
          - name
          - -name
          - updatedAt
          - -updatedAt
        x-orcon-enum-kind: identifier
        default: -updatedAt
    - name: activationState
      in: query
      required: false
      description: Return only flows in this activation state.
      schema:
        type: string
        enum:
          - ACTIVE
          - INACTIVE
    - name: q
      in: query
      required: false
      description: Return only flows whose name starts with this text (case-insensitive).
      schema:
        type: string
        maxLength: 200
        examples:
          - Welcome
  responses:
    '200':
      description: One page of flows.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/FlowList
          examples:
            firstPageOfFlows:
              summary: Two flows
              value:
                items:
                  - id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
                    projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                    name: Welcome email
                    activationState: INACTIVE
                    hasUnpublishedChanges: true
                    draftRevision: 0
                    createdAt: '2026-10-12T15:04:05Z'
                    updatedAt: '2026-10-12T15:04:05Z'
                  - id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a63
                    projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                    name: Weekly report
                    activationState: INACTIVE
                    hasUnpublishedChanges: true
                    draftRevision: 0
                    createdAt: '2026-10-12T15:04:05Z'
                    updatedAt: '2026-10-12T15:04:05Z'
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable
post:
  operationId: createFlow
  summary: Create a flow in a project
  description: >-
    Creates an empty flow in the project and returns it with its id. Use it to start a new automation;
    the flow has no published version until you publish its draft. Request body limit: 1 MiB.
  tags:
    - flows
  x-orcon-permission: flow:create
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-idempotency: optional
  x-orcon-audit: flow.created
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - csrf-check-failed
    - forbidden
    - not-found
    - conflict
    - idempotency-in-progress
    - project-managed-by-git
    - payload-too-large
    - unsupported-media-type
    - idempotency-key-reused
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: flows create
  x-orcon-mcp:
    level: write
    tool: create_flow
    description: Create an empty flow in a project.
  x-orcon-examples:
    - name: createNamedFlow
      scenario: empty-project
      request:
        pathParams:
          projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
        body: createNamedFlow
      response:
        status: 201
        body: createNamedFlow
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/CreateFlowRequest
        examples:
          createNamedFlow:
            summary: A flow with a name
            value:
              name: Welcome email
  responses:
    '201':
      description: The created flow.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
        ETag:
          $ref: ../openapi.yaml#/components/headers/ETag
        Location:
          $ref: ../openapi.yaml#/components/headers/Location
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Flow
          examples:
            createNamedFlow:
              summary: The new flow
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
                projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                name: Welcome email
                activationState: INACTIVE
                hasUnpublishedChanges: true
                draftRevision: 0
                createdAt: '2026-10-12T15:04:05Z'
                updatedAt: '2026-10-12T15:04:05Z'
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '409':
      $ref: ../openapi.yaml#/components/responses/Conflict
    '413':
      $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
    '415':
      $ref: ../openapi.yaml#/components/responses/UnsupportedMediaType
    '422':
      $ref: ../openapi.yaml#/components/responses/IdempotencyKeyReused
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable

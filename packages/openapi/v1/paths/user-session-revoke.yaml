x-orcon-resource: action
parameters:
  - $ref: ../openapi.yaml#/components/parameters/SessionId
post:
  operationId: revokeSession
  summary: Revoke one of my browser sessions
  description: >-
    Revokes one live session of the signed-in user. Revoking the session the request carries signs out:
    the response clears both cookies and a later request with the same token gets 401 unauthenticated;
    that is audited as logout. Revoking another session of the same user ends it at once, leaves the
    cookies of this request alone and is audited as session.revoked. The id of a session that belongs to
    another user, that is already revoked or that does not exist is not found, so the response never
    reveals another user's session. API keys are revoked with the API key operations instead.
  tags:
    - session
  x-orcon-permission: authenticated
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-idempotency: optional
  x-orcon-audit: logout
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - csrf-check-failed
    - not-found
    - idempotency-in-progress
    - idempotency-key-reused
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    none:
      category: interactive-session-only
      reason: Browser sessions only; API keys are revoked with the API key operations.
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: signOutCurrentSession
      scenario: signed-in-user
      request:
        pathParams:
          sessionId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a80
      response:
        status: 204
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
  responses:
    '204':
      description: The session was revoked. When it was the session of the request the cookies are cleared.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/CsrfCheckFailed
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '409':
      $ref: ../openapi.yaml#/components/responses/Conflict
    '422':
      $ref: ../openapi.yaml#/components/responses/IdempotencyKeyReused
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable

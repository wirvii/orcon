x-orcon-resource: action
parameters:
  - $ref: ../openapi.yaml#/components/parameters/HumanTaskId
post:
  operationId: completeHumanTask
  summary: Complete a human task
  description: >-
    Submits the result of a task that waits for a person, such as an approval or a form, and lets the
    execution continue. A task can be completed once; completing it again is refused.
  tags:
    - executions
  x-orcon-permission: human-task:resolve
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-idempotency: optional
  x-orcon-audit: execution.human_action_taken
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - forbidden
    - not-found
    - conflict
    - idempotency-in-progress
    - payload-too-large
    - idempotency-key-reused
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: human-tasks complete
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: approveTask
      scenario: execution-with-human-task
      request:
        pathParams:
          humanTaskId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a68
        body: approveTask
      response:
        status: 200
        body: approveTask
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/CompleteHumanTaskRequest
        examples:
          approveTask:
            summary: Approve the request
            value:
              outcome: APPROVED
              note: Looks good.
  responses:
    '200':
      description: The completed task.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/HumanTask
          examples:
            approveTask:
              summary: The task is completed
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a68
                executionId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a64
                nodeId: approve
                status: COMPLETED
                completedBy: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a61
                completedAt: '2026-10-12T15:04:09Z'
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '409':
      $ref: ../openapi.yaml#/components/responses/Conflict
    '413':
      $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
    '422':
      $ref: ../openapi.yaml#/components/responses/IdempotencyKeyReused
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable

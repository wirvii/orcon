x-orcon-resource: action
parameters:
  - $ref: ../openapi.yaml#/components/parameters/FlowId
post:
  operationId: validateDraft
  summary: Validate the draft of a flow
  description: >-
    Checks the stored draft against the static rules of the flow format and returns every issue it finds.
    It changes nothing; publication runs the same checks and refuses a draft with errors.
  tags:
    - flows
  x-orcon-permission: flow:read
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-idempotency: optional
  x-orcon-audit: none
  x-orcon-audit-reason: Validation reads the draft and changes nothing.
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - forbidden
    - not-found
    - idempotency-in-progress
    - idempotency-key-reused
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: flows validate
  x-orcon-mcp:
    level: read
    tool: validate_draft
    description: Validate the draft of a flow and list its issues.
  x-orcon-examples:
    - name: validDraft
      scenario: flow-with-valid-draft
      request:
        pathParams:
          flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
      response:
        status: 200
        body: validDraft
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
  responses:
    '200':
      description: The validation result.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ValidationResult
          examples:
            validDraft:
              summary: A draft without issues
              value:
                valid: true
                draftRevision: 1
                issues: []
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '409':
      $ref: ../openapi.yaml#/components/responses/Conflict
    '422':
      $ref: ../openapi.yaml#/components/responses/IdempotencyKeyReused
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable

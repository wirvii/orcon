x-orcon-resource: collection
parameters:
  - $ref: ../openapi.yaml#/components/parameters/ProjectId
get:
  operationId: listCredentials
  summary: List the credentials of a project
  description: >-
    Returns the credentials the project owns and the ones other projects of the organization shared with it,
    one page at a time, ordered by name. Secret values are never returned; each item tells whether a secret
    is set. Items do not carry public fields; read one credential to get them.
  tags:
    - credentials
  x-orcon-permission: credential:read
  x-orcon-rate-class: read
  x-orcon-stability: stable
  x-orcon-audit: none
  x-orcon-problems:
    - invalid-page-token
    - validation-failed
    - unauthenticated
    - forbidden
    - not-found
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: credentials list
  x-orcon-mcp:
    level: read
    tool: list_credentials
    description: List the credentials a project owns or may use, without secret values.
  x-orcon-examples:
    - name: firstPageOfCredentials
      scenario: project-with-flows
      request:
        pathParams:
          projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
        query:
          limit: 50
      response:
        status: 200
        body: firstPageOfCredentials
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/Limit
    - $ref: ../openapi.yaml#/components/parameters/PageToken
  responses:
    '200':
      description: One page of credentials, without public fields.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CredentialList
          examples:
            firstPageOfCredentials:
              summary: Two credentials, one owned and one shared with the project
              value:
                items:
                  - id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a90
                    projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                    owned: true
                    name: Slack notifications
                    type: orcon.http@1
                    status: OK
                    allowedHosts:
                      - hooks.slack.com
                    versionCount: 2
                    secret:
                      set: true
                      updatedAt: '2026-10-12T15:04:05Z'
                      updatedBy: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a91
                    createdAt: '2026-10-12T15:04:05Z'
                    updatedAt: '2026-10-12T15:04:05Z'
                  - id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a92
                    projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a77
                    owned: false
                    name: Shared CRM token
                    type: orcon.http@1
                    status: NEEDS_SECRET
                    allowedHosts:
                      - api.crm.example.com
                    versionCount: 1
                    secret:
                      set: false
                    createdAt: '2026-10-12T15:04:05Z'
                    updatedAt: '2026-10-12T15:04:05Z'
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable
post:
  operationId: createCredential
  summary: Create a credential in a project
  description: >-
    Creates a credential owned by the project and stores its secret fields encrypted. The response never
    contains the secret values: read secret.set to know whether one is stored. Request body limit: 1 MiB.
  tags:
    - credentials
  x-orcon-permission: credential:create
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-idempotency: optional
  x-orcon-audit: credential.created
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - csrf-check-failed
    - forbidden
    - not-found
    - conflict
    - idempotency-in-progress
    - payload-too-large
    - unsupported-media-type
    - idempotency-key-reused
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: credentials create
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: createSlackCredential
      scenario: empty-project
      request:
        pathParams:
          projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
        body: createSlackCredential
      response:
        status: 201
        body: createSlackCredential
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/CreateCredentialRequest
        examples:
          createSlackCredential:
            summary: A header credential that may only reach the Slack hook
            value:
              name: Slack notifications
              type: orcon.http@1
              allowedHosts:
                - hooks.slack.com
              publicFields:
                header: Authorization
              secretFields:
                token: example-secret-1
  responses:
    '201':
      description: The created credential, without its secret values.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
        ETag:
          $ref: ../openapi.yaml#/components/headers/ETag
        Location:
          $ref: ../openapi.yaml#/components/headers/Location
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Credential
          examples:
            createSlackCredential:
              summary: The new credential with its secret set
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a90
                projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                owned: true
                name: Slack notifications
                type: orcon.http@1
                status: OK
                allowedHosts:
                  - hooks.slack.com
                versionCount: 1
                secret:
                  set: true
                  updatedAt: '2026-10-12T15:04:05Z'
                  updatedBy: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a91
                publicFields:
                  header: Authorization
                createdAt: '2026-10-12T15:04:05Z'
                updatedAt: '2026-10-12T15:04:05Z'
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '409':
      $ref: ../openapi.yaml#/components/responses/Conflict
    '413':
      $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
    '415':
      $ref: ../openapi.yaml#/components/responses/UnsupportedMediaType
    '422':
      $ref: ../openapi.yaml#/components/responses/IdempotencyKeyReused
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable

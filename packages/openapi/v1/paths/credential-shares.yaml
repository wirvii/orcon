x-orcon-resource: collection
parameters:
  - $ref: ../openapi.yaml#/components/parameters/CredentialId
post:
  operationId: createCredentialShare
  summary: Let another project use a credential
  description: >-
    Lets a project of the same organization use the credential in its flows, without reading it. Only the
    owning project may share it. Sharing with the owning project itself is refused. Request body limit: 1 MiB.
  tags:
    - credentials
  x-orcon-permission: credential:share
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-idempotency: optional
  x-orcon-audit: credential.shared
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - csrf-check-failed
    - forbidden
    - not-found
    - conflict
    - idempotency-in-progress
    - payload-too-large
    - unsupported-media-type
    - idempotency-key-reused
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: credentials share
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: shareWithProject
      scenario: organization-with-projects
      request:
        pathParams:
          credentialId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a90
        body: shareWithProject
      response:
        status: 204
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/ShareCredentialRequest
        examples:
          shareWithProject:
            summary: Let the Operations project use the credential
            value:
              projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a77
  responses:
    '204':
      description: The credential is shared with the project.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '409':
      $ref: ../openapi.yaml#/components/responses/Conflict
    '413':
      $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
    '415':
      $ref: ../openapi.yaml#/components/responses/UnsupportedMediaType
    '422':
      $ref: ../openapi.yaml#/components/responses/IdempotencyKeyReused
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable

          schema:
            $ref: ../openapi.yaml#/components/schemas/FlowDraft
          examples:
            renameInDocument:
              summary: The draft after the patch
              value:
                flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
                revision: 2
                document:
                  format: orcon/flow@1
                  id: 01930000-0000-7000-8000-00000000000a
                  name: Welcome email v2
                  settings:
                    branchMode: PARALLEL
                  variables: []
                  nodes:
                    - id: start
                      name: Start
                      element: startEvent
                      type: orcon.start@1
                      parameters: {}
                    - id: greeting
                      name: Set greeting
                      element: task
                      type: orcon.set@1
                      parameters: {}
                    - id: end
                      name: End
                      element: endEvent
                      type: orcon.end@1
                      parameters: {}
                  edges:
                    - id: e1
                      from:
                        node: start

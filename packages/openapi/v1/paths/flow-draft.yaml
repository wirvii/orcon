x-orcon-resource: singleton
parameters:
  - $ref: ../openapi.yaml#/components/parameters/FlowId
get:
  operationId: getDraft
  summary: Get the draft of a flow
  description: >-
    Returns the editable draft of a flow, including the flow document, with its revision as the ETag.
    Use it to read what the next publication will contain; published versions are not affected by the
    draft.
  tags:
    - flows
  x-orcon-permission: flow:read
  x-orcon-rate-class: read
  x-orcon-stability: stable
  x-orcon-audit: none
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - forbidden
    - not-found
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: flows pull
  x-orcon-mcp:
    level: read
    tool: get_draft
    description: Get the editable draft of a flow.
  x-orcon-examples:
    - name: getDraftOfFlow
      scenario: flow-with-valid-draft
      request:
        pathParams:
          flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
      response:
        status: 200
        body: getDraftOfFlow
  responses:
    '200':
      description: The draft of the flow.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
        ETag:
          $ref: ../openapi.yaml#/components/headers/ETag
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/FlowDraft
          examples:
            getDraftOfFlow:
              summary: A draft with a trigger, a step and an end
              value:
                flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
                revision: 1
                document:
                  format: orcon/flow@1
                  id: 01930000-0000-7000-8000-00000000000a
                  name: Welcome email
                  settings:
                    branchMode: PARALLEL
                  variables: []
                  nodes:
                    - id: start
                      name: Start
                      element: startEvent
                      type: orcon.start@1
                      parameters: {}
                    - id: greeting
                      name: Set greeting
                      element: task
                      type: orcon.set@1
                      parameters: {}
                    - id: end
                      name: End
                      element: endEvent
                      type: orcon.end@1
                      parameters: {}
                  edges:
                    - id: e1
                      from:
                        node: start
                        port: main
                      to:
                        node: greeting
                      kind: SEQUENCE
                    - id: e2
                      from:
                        node: greeting
                        port: main
                      to:
                        node: end
                      kind: SEQUENCE
                  editor: {}
                updatedAt: '2026-10-12T15:10:00Z'
                updatedBy: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a61
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable
put:
  operationId: replaceDraft
  summary: Replace the draft of a flow
  description: >-
    Replaces the whole document of the draft. Send the revision you read in If-Match; if somebody saved
    in between, the request is refused with the current revision so nothing is overwritten. Request body
    limit: 8 MiB.
  tags:
    - flows
  x-orcon-permission: flow:update
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-audit: flow.updated
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - forbidden
    - not-found
    - project-managed-by-git
    - precondition-failed
    - payload-too-large
    - precondition-required
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: flows push
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: replaceDraft
      scenario: flow-with-valid-draft
      request:
        pathParams:
          flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
        headers:
          If-Match: '"1"'
        body: replaceDraft
      response:
        status: 200
        body: replaceDraft
    - name: replaceStaleDraft
      scenario: flow-with-valid-draft
      request:
        pathParams:
          flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
        headers:
          If-Match: '"0"'
        body: replaceDraft
      response:
        status: 412
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/ReplaceDraftRequest
        examples:
          replaceDraft:
            summary: A complete document
            value:
              document:
                format: orcon/flow@1
                id: 01930000-0000-7000-8000-00000000000a
                name: Welcome email
                settings:
                  branchMode: PARALLEL
                variables: []
                nodes:
                  - id: start
                    name: Start
                    element: startEvent
                    type: orcon.start@1
                    parameters: {}
                  - id: greeting
                    name: Set greeting
                    element: task
                    type: orcon.set@1
                    parameters: {}
                  - id: end
                    name: End
                    element: endEvent
                    type: orcon.end@1
                    parameters: {}
                edges:
                  - id: e1
                    from:
                      node: start
                      port: main
                    to:
                      node: greeting
                    kind: SEQUENCE
                  - id: e2
                    from:
                      node: greeting
                      port: main
                    to:
                      node: end
                    kind: SEQUENCE
                editor: {}
  responses:
    '200':
      description: The saved draft.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
        ETag:
          $ref: ../openapi.yaml#/components/headers/ETag
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/FlowDraft
          examples:
            replaceDraft:
              summary: The draft at the new revision
              value:
                flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
                revision: 2
                document:
                  format: orcon/flow@1
                  id: 01930000-0000-7000-8000-00000000000a
                  name: Welcome email
                  settings:
                    branchMode: PARALLEL
                  variables: []
                  nodes:
                    - id: start
                      name: Start
                      element: startEvent
                      type: orcon.start@1
                      parameters: {}
                    - id: greeting
                      name: Set greeting
                      element: task
                      type: orcon.set@1
                      parameters: {}
                    - id: end
                      name: End
                      element: endEvent
                      type: orcon.end@1
                      parameters: {}
                  edges:
                    - id: e1
                      from:
                        node: start
                        port: main
                      to:
                        node: greeting
                      kind: SEQUENCE
                    - id: e2
                      from:
                        node: greeting
                        port: main
                      to:
                        node: end
                      kind: SEQUENCE
                  editor: {}
                updatedAt: '2026-10-12T15:10:00Z'
                updatedBy: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a61
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '409':
      $ref: ../openapi.yaml#/components/responses/Conflict
    '412':
      $ref: ../openapi.yaml#/components/responses/PreconditionFailed
    '413':
      $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
    '428':
      $ref: ../openapi.yaml#/components/responses/PreconditionRequired
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable
patch:
  operationId: updateDraft
  summary: Change the draft of a flow with a patch
  description: >-
    Applies a JSON Patch (RFC 6902) to the draft document. Start the patch with a test operation to make
    it depend on a value you read; if any operation fails, nothing is applied. Request body limit: 8 MiB.
  tags:
    - flows
  x-orcon-permission: flow:update
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-audit: flow.updated
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - forbidden
    - not-found
    - project-managed-by-git
    - precondition-failed
    - payload-too-large
    - precondition-required
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: flows patch
  x-orcon-mcp:
    level: write
    tool: update_draft
    description: Apply a JSON Patch to the draft of a flow, with the expected revision.
  x-orcon-examples:
    - name: renameInDocument
      scenario: flow-with-valid-draft
      request:
        pathParams:
          flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
        headers:
          If-Match: '"1"'
        body: renameInDocument
      response:
        status: 200
        body: renameInDocument
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/json-patch+json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/JsonPatch
        examples:
          renameInDocument:
            summary: Rename the flow in the document
            value:
              - op: test
                path: /name
                value: Welcome email
              - op: replace
                path: /name
                value: Welcome email v2
  responses:
    '200':
      description: The patched draft.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit

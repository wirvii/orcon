x-orcon-resource: item
parameters:
  - $ref: ../openapi.yaml#/components/parameters/ExecutionId
get:
  operationId: getExecution
  summary: Get an execution
  description: >-
    Returns one execution with its status and, when it failed, why. The output summary is included only
    if the caller has the permission to read execution data; otherwise dataHidden is true.
  tags:
    - executions
  x-orcon-permission: execution:read
  x-orcon-rate-class: read
  x-orcon-stability: stable
  x-orcon-audit: none
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - forbidden
    - not-found
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: executions get
  x-orcon-mcp:
    level: read
    tool: get_execution
    description: Get one execution with its status and failure.
  x-orcon-examples:
    - name: getFinishedExecution
      scenario: execution-succeeded
      request:
        pathParams:
          executionId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a64
      response:
        status: 200
        body: getFinishedExecution
  responses:
    '200':
      description: The execution.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Execution
          examples:
            getFinishedExecution:
              summary: A finished execution
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a64
                flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
                projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                flowVersion: 1
                mode: MANUAL
                status: SUCCEEDED
                createdAt: '2026-10-12T15:04:05Z'
                startedAt: '2026-10-12T15:04:05Z'
                finishedAt: '2026-10-12T15:04:09Z'
                dataHidden: false
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable

x-orcon-resource: collection
parameters:
  - $ref: ../openapi.yaml#/components/parameters/OrgId
get:
  operationId: listProjects
  summary: List the projects of an organization
  description: >-
    Returns the projects of one organization that the caller can read, one page at a time. Use it to find
    the project that owns the flows you want to work with; projects the caller cannot read are left out.
  tags:
    - projects
  x-orcon-permission: org:read
  x-orcon-rate-class: read
  x-orcon-stability: stable
  x-orcon-audit: none
  x-orcon-problems:
    - invalid-page-token
    - validation-failed
    - unauthenticated
    - forbidden
    - not-found
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: projects list
  x-orcon-mcp:
    level: read
    tool: list_projects
    description: List the projects the caller can read in an organization.
  x-orcon-examples:
    - name: firstPageOfProjects
      scenario: organization-with-projects
      request:
        pathParams:
          orgId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a71
        query:
          limit: 50
      response:
        status: 200
        body: firstPageOfProjects
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/Limit
    - $ref: ../openapi.yaml#/components/parameters/PageToken
    - name: sort
      in: query
      required: false
      description: Sort expression; a leading minus sorts in descending order.
      x-orcon-sort-default: name
      schema:
        type: string
        enum:
          - name
          - -name
          - createdAt
          - -createdAt
        x-orcon-enum-kind: identifier
        default: name
    - name: q
      in: query
      required: false
      description: Return only projects whose name starts with this text (case-insensitive).
      schema:
        type: string
        maxLength: 200
        examples:
          - Customer
    - name: environment
      in: query
      required: false
      description: Return only projects with this environment label.
      schema:
        type: string
        maxLength: 100
        examples:
          - prod
  responses:
    '200':
      description: One page of projects.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ProjectList
          examples:
            firstPageOfProjects:
              summary: Two projects and a token for the next page
              value:
                items:
                  - id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                    orgId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a71
                    name: Customer onboarding
                    slug: onboarding
                    handle: onboarding
                    environment: prod
                    protected: true
                    createdAt: '2026-10-12T15:04:05Z'
                    updatedAt: '2026-10-12T15:04:05Z'
                  - id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a77
                    orgId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a71
                    name: Internal tools
                    slug: internal-tools
                    handle: internal-tools
                    protected: true
                    createdAt: '2026-10-12T15:04:05Z'
                    updatedAt: '2026-10-12T15:04:05Z'
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable
post:
  operationId: createProject
  summary: Create a project in an organization
  description: >-
    Creates a project in the organization and returns it. New projects are protected unless you say otherwise;
    use the environment label to mark a project as dev, staging or prod. Request body limit: 1 MiB.
  tags:
    - projects
  x-orcon-permission: project:create
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-idempotency: optional
  x-orcon-audit: project.created
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - forbidden
    - not-found
    - conflict
    - idempotency-in-progress
    - payload-too-large
    - idempotency-key-reused
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: projects create
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: createProductionProject
      scenario: organization-ready
      request:
        pathParams:
          orgId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a71
        body: createProductionProject
      response:
        status: 201
        body: createProductionProject
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/CreateProjectRequest
        examples:
          createProductionProject:
            summary: A protected production project
            value:
              name: Customer onboarding
              slug: onboarding
              environment: prod
  responses:
    '201':
      description: The created project.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
        ETag:
          $ref: ../openapi.yaml#/components/headers/ETag
        Location:
          $ref: ../openapi.yaml#/components/headers/Location
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Project
          examples:
            createProductionProject:
              summary: The new project
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                orgId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a71
                name: Customer onboarding
                slug: onboarding
                handle: onboarding
                environment: prod
                protected: true
                createdAt: '2026-10-12T15:04:05Z'
                updatedAt: '2026-10-12T15:04:05Z'
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '409':
      $ref: ../openapi.yaml#/components/responses/Conflict
    '413':
      $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
    '422':
      $ref: ../openapi.yaml#/components/responses/IdempotencyKeyReused
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable

x-orcon-resource: singleton
parameters:
  - $ref: ../openapi.yaml#/components/parameters/CredentialId
put:
  operationId: replaceCredentialSecret
  summary: Replace the secret of a credential
  description: >-
    Stores a new version of the secret and makes it current; earlier versions are kept. The new secret is
    write-only: the response shows only that a secret is set, when it was written and by whom. Send the
    ETag you read in If-Match; a stale ETag is refused so a concurrent rotation is never overwritten.
    Request body limit: 1 MiB.
  tags:
    - credentials
  x-orcon-permission: credential:update
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-audit: credential.updated
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - csrf-check-failed
    - forbidden
    - not-found
    - precondition-failed
    - payload-too-large
    - unsupported-media-type
    - precondition-required
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: credentials replace-secret
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: rotateSlackToken
      scenario: empty-project
      request:
        pathParams:
          credentialId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a90
        headers:
          If-Match: '"2-1"'
        body: rotateSlackToken
      response:
        status: 200
        body: rotateSlackToken
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/ReplaceCredentialSecretRequest
        examples:
          rotateSlackToken:
            summary: Store a rotated token
            value:
              secretFields:
                token: example-secret-2
  responses:
    '200':
      description: The credential with its new version, without the secret values.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
        ETag:
          $ref: ../openapi.yaml#/components/headers/ETag
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Credential
          examples:
            rotateSlackToken:
              summary: The credential with version 3 current
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a90
                projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                owned: true
                name: Slack notifications
                type: orcon.http@1
                status: OK
                allowedHosts:
                  - hooks.slack.com
                versionCount: 3
                secret:
                  set: true
                  updatedAt: '2026-10-12T15:20:00Z'
                  updatedBy: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a91
                publicFields:
                  header: Authorization
                createdAt: '2026-10-12T15:04:05Z'
                updatedAt: '2026-10-12T15:20:00Z'
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '412':
      $ref: ../openapi.yaml#/components/responses/PreconditionFailed
    '413':
      $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
    '415':
      $ref: ../openapi.yaml#/components/responses/UnsupportedMediaType
    '428':
      $ref: ../openapi.yaml#/components/responses/PreconditionRequired
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable

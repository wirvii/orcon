x-orcon-resource: item
parameters:
  - $ref: ../openapi.yaml#/components/parameters/CredentialId
get:
  operationId: getCredential
  summary: Get a credential
  description: >-
    Returns one credential with its public fields and the state of its secret. The secret value is never
    returned. The response carries the ETag to send in If-Match when you change the credential.
  tags:
    - credentials
  x-orcon-permission: credential:read
  x-orcon-rate-class: read
  x-orcon-stability: stable
  x-orcon-audit: none
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - forbidden
    - not-found
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: credentials get
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: getSlackCredential
      scenario: empty-project
      request:
        pathParams:
          credentialId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a90
      response:
        status: 200
        body: getSlackCredential
  responses:
    '200':
      description: The credential, without its secret values.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
        ETag:
          $ref: ../openapi.yaml#/components/headers/ETag
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Credential
          examples:
            getSlackCredential:
              summary: The credential with its public fields
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a90
                projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                owned: true
                name: Slack notifications
                type: orcon.http@1
                status: OK
                allowedHosts:
                  - hooks.slack.com
                versionCount: 2
                secret:
                  set: true
                  updatedAt: '2026-10-12T15:04:05Z'
                  updatedBy: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a91
                publicFields:
                  header: Authorization
                createdAt: '2026-10-12T15:04:05Z'
                updatedAt: '2026-10-12T15:04:05Z'
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable
patch:
  operationId: updateCredential
  summary: Update the name or the allowed hosts of a credential
  description: >-
    Changes the fields you send and leaves the others as they are (JSON Merge Patch). Only the owning project
    may change a credential. Changing the secret is a different operation, replaceCredentialSecret. Send the
    ETag you read in If-Match; a stale ETag is refused. Request body limit: 1 MiB.
  tags:
    - credentials
  x-orcon-permission: credential:update
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-audit: credential.updated
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - csrf-check-failed
    - forbidden
    - not-found
    - conflict
    - precondition-failed
    - payload-too-large
    - unsupported-media-type
    - precondition-required
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: credentials update
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: renameSlackCredential
      scenario: empty-project
      request:
        pathParams:
          credentialId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a90
        headers:
          If-Match: '"2-1"'
        body: renameSlackCredential
      response:
        status: 200
        body: renameSlackCredential
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/merge-patch+json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/UpdateCredentialRequest
        examples:
          renameSlackCredential:
            summary: Rename the credential
            value:
              name: Slack alerts
  responses:
    '200':
      description: The updated credential, without its secret values.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
        ETag:
          $ref: ../openapi.yaml#/components/headers/ETag
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Credential
          examples:
            renameSlackCredential:
              summary: The credential with its new name
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a90
                projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                owned: true
                name: Slack alerts
                type: orcon.http@1
                status: OK
                allowedHosts:
                  - hooks.slack.com
                versionCount: 2
                secret:
                  set: true
                  updatedAt: '2026-10-12T15:04:05Z'
                  updatedBy: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a91
                publicFields:
                  header: Authorization
                createdAt: '2026-10-12T15:04:05Z'
                updatedAt: '2026-10-12T15:10:00Z'
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '409':
      $ref: ../openapi.yaml#/components/responses/Conflict
    '412':
      $ref: ../openapi.yaml#/components/responses/PreconditionFailed
    '413':
      $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
    '415':
      $ref: ../openapi.yaml#/components/responses/UnsupportedMediaType
    '428':
      $ref: ../openapi.yaml#/components/responses/PreconditionRequired
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable
delete:
  operationId: deleteCredential
  summary: Delete a credential
  description: >-
    Deletes the credential with its versions and every share with other projects. Flows that used it fail
    their next dispatch with a clear error. Send the ETag you read in If-Match.
  tags:
    - credentials
  x-orcon-permission: credential:delete
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-audit: credential.deleted
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - forbidden
    - not-found
    - precondition-failed
    - precondition-required
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: credentials delete
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: deleteSlackCredential
      scenario: empty-project
      request:
        pathParams:
          credentialId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a90
        headers:
          If-Match: '"2-1"'
      response:
        status: 204
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IfMatch
  responses:
    '204':
      description: The credential was deleted.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '412':
      $ref: ../openapi.yaml#/components/responses/PreconditionFailed
    '428':
      $ref: ../openapi.yaml#/components/responses/PreconditionRequired
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable

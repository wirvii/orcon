x-orcon-resource: item
parameters:
  - $ref: ../openapi.yaml#/components/parameters/CredentialId
  - $ref: ../openapi.yaml#/components/parameters/ProjectId
delete:
  operationId: deleteCredentialShare
  summary: Stop sharing a credential with a project
  description: >-
    Removes the share, so the project can no longer use the credential. Its next dispatch fails with a clear
    error; runs already in progress are not interrupted. Only the owning project may unshare. Send the ETag
    of the credential you read in If-Match; a stale ETag is refused, so an unshare never acts on a credential
    that changed underneath you.
  tags:
    - credentials
  x-orcon-permission: credential:share
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-audit: credential.unshared
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - csrf-check-failed
    - forbidden
    - not-found
    - precondition-failed
    - precondition-required
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: credentials unshare
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: unshareFromProject
      scenario: organization-with-projects
      request:
        pathParams:
          credentialId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a90
          projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a77
        headers:
          If-Match: '"2-1"'
      response:
        status: 204
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IfMatch
  responses:
    '204':
      description: The share was removed.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '412':
      $ref: ../openapi.yaml#/components/responses/PreconditionFailed
    '428':
      $ref: ../openapi.yaml#/components/responses/PreconditionRequired
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable

x-orcon-resource: singleton
get:
  operationId: getCurrentUser
  summary: Get the signed-in user
  description: >-
    Returns the user of the session the request carries, with that session. The ETag is the one updateCurrentUser
    expects in If-Match. It never returns the password hash or the session token.
  tags:
    - session
  x-orcon-permission: authenticated
  x-orcon-rate-class: read
  x-orcon-stability: stable
  x-orcon-audit: none
  x-orcon-problems:
    - unauthenticated
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: users whoami
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: currentUser
      scenario: signed-in-user
      request: {}
      response:
        status: 200
        body: currentUser
  responses:
    '200':
      description: The signed-in user and the current session.
      headers:
        ETag:
          $ref: ../openapi.yaml#/components/headers/ETag
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CurrentUser
          examples:
            currentUser:
              summary: A signed-in user
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a81
                email: ana@example.com
                displayName: Ana Torres
                currentSession:
                  id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a80
                  createdAt: '2026-10-14T15:04:05Z'
                  expiresAt: '2026-11-13T15:04:05Z'
                  idleExpiresAt: '2026-10-14T23:04:05Z'
                  assuranceLevel: AAL1
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable
patch:
  operationId: updateCurrentUser
  summary: Update my profile
  description: >-
    Changes the fields you send and leaves the others as they are (JSON Merge Patch). Today the only field
    is the display name. Send the ETag you read from getCurrentUser in If-Match; a stale ETag is refused so
    concurrent edits are never lost. The change is recorded as account.renamed. The password and the email
    are not changed here. Request body limit: 1 MiB.
  tags:
    - session
  x-orcon-permission: authenticated
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-audit: account.renamed
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - csrf-check-failed
    - precondition-failed
    - payload-too-large
    - unsupported-media-type
    - precondition-required
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: users update
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: renameMyAccount
      scenario: signed-in-user
      request:
        headers:
          If-Match: '"1760454245000000"'
        body: renameMyAccount
      response:
        status: 200
        body: renamedUser
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IfMatch
  requestBody:
    required: true
    content:
      application/merge-patch+json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/UpdateCurrentUserRequest
        examples:
          renameMyAccount:
            summary: Change the display name
            value:
              displayName: Ana Torres
  responses:
    '200':
      description: The updated user and the session the request carries.
      headers:
        ETag:
          $ref: ../openapi.yaml#/components/headers/ETag
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CurrentUser
          examples:
            renamedUser:
              summary: The user with the new name
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a81
                email: ana@example.com
                displayName: Ana Torres
                currentSession:
                  id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a80
                  createdAt: '2026-10-14T15:04:05Z'
                  expiresAt: '2026-11-13T15:04:05Z'
                  idleExpiresAt: '2026-10-14T23:04:05Z'
                  assuranceLevel: AAL1
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/CsrfCheckFailed
    '412':
      $ref: ../openapi.yaml#/components/responses/PreconditionFailed
    '413':
      $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
    '415':
      $ref: ../openapi.yaml#/components/responses/UnsupportedMediaType
    '428':
      $ref: ../openapi.yaml#/components/responses/PreconditionRequired
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable

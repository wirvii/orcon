x-orcon-resource: collection
parameters:
  - $ref: ../openapi.yaml#/components/parameters/FlowId
post:
  operationId: createExecution
  summary: Run a flow by hand
  description: >-
    Starts an execution of the active version of the flow and, with wait, holds the answer until it finishes.
    If it finishes in time you get 200 with the finished execution; otherwise you get 202 and read it
    later from the Location address. Request body limit: 1 MiB.
  tags:
    - executions
  x-orcon-permission: flow:execute
  x-orcon-rate-class: run
  x-orcon-stability: stable
  x-orcon-idempotency: required
  x-orcon-audit: none
  x-orcon-audit-reason: 'The execution is its own record: it is stored with its mode, flow version and
    starter.'
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - forbidden
    - not-found
    - conflict
    - idempotency-in-progress
    - payload-too-large
    - idempotency-key-reused
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    command: flows run
  x-orcon-mcp:
    level: destructive
    tool: run_flow
    description: Run the active version of a flow and optionally wait for the result.
  x-orcon-examples:
    - name: runWithOneItem
      scenario: flow-active
      request:
        pathParams:
          flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
        query:
          wait: 10
        headers:
          Idempotency-Key: run-example-1
        body: runWithOneItem
      response:
        status: 200
        body: runWithOneItem
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdempotencyKeyRequired
    - name: wait
      in: query
      required: false
      description: Seconds to hold the answer while the execution runs, from 0 to 60; 0 returns at once.
      schema:
        type: integer
        minimum: 0
        maximum: 60
        default: 0
        examples:
          - 10
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/CreateExecutionRequest
        examples:
          runWithOneItem:
            summary: Start with one input item
            value:
              input:
                - email: ana@example.com
  responses:
    '200':
      description: The execution finished within the wait.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Execution
          examples:
            runWithOneItem:
              summary: A finished execution
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a64
                flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
                projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                flowVersion: 1
                mode: MANUAL
                status: SUCCEEDED
                createdAt: '2026-10-12T15:04:05Z'
                startedAt: '2026-10-12T15:04:05Z'
                finishedAt: '2026-10-12T15:04:09Z'
                dataHidden: false
    '202':
      description: The execution is still running; read it later from the Location address.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
        Location:
          $ref: ../openapi.yaml#/components/headers/Location
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Execution
          examples:
            runStillRunning:
              summary: A queued execution
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a64
                flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
                projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                flowVersion: 1
                mode: MANUAL
                status: QUEUED
                createdAt: '2026-10-12T15:04:05Z'
                dataHidden: false
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/Forbidden
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '409':
      $ref: ../openapi.yaml#/components/responses/Conflict
    '413':
      $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
    '422':
      $ref: ../openapi.yaml#/components/responses/IdempotencyKeyReused
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable

x-orcon-resource: collection
post:
  operationId: createSession
  summary: Sign in with an email and a password
  description: >-
    Checks the email and the password and starts a browser session. The response sets two cookies: the
    session cookie, which holds an opaque token and is HttpOnly, and the CSRF cookie, whose value every
    unsafe request sends back in the Orcon-Csrf-Token header. A session the request already carries is
    revoked and replaced. A wrong email, a wrong password, a disabled account and an account without a
    password all get the same 401 unauthenticated. Too many failed attempts get 429 rate-limited with
    Retry-After, whether or not the account exists. Request body limit: 1 MiB.
  tags:
    - session
  security: []
  x-orcon-permission: anonymous
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-idempotency: optional
  x-orcon-audit: login.succeeded
  x-orcon-problems:
    - validation-failed
    - unauthenticated
    - csrf-check-failed
    - conflict
    - secret-already-issued
    - idempotency-in-progress
    - idempotency-key-reused
    - payload-too-large
    - unsupported-media-type
    - rate-limited
    - internal-error
    - service-unavailable
  x-orcon-cli:
    none:
      category: interactive-session-only
      reason: The command line signs in with device authorization (ADR-0058), not with a password.
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: signInWithPassword
      scenario: account-with-password
      request:
        body: signInWithPassword
      response:
        status: 201
        body: signedInSession
  parameters:
    - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/SessionCredentials
        examples:
          signInWithPassword:
            summary: Email and password of an account
            value:
              email: ana@example.com
              password: example-secret-1
  responses:
    '201':
      description: The session was started. The Set-Cookie headers carry the session and CSRF cookies.
      headers:
        Orcon-Request-Id:
          $ref: ../openapi.yaml#/components/headers/OrconRequestId
        RateLimit:
          $ref: ../openapi.yaml#/components/headers/RateLimit
        RateLimit-Policy:
          $ref: ../openapi.yaml#/components/headers/RateLimitPolicy
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/Session
          examples:
            signedInSession:
              summary: The new session; the token itself is never in the body
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a80
                createdAt: '2026-10-14T15:04:05Z'
                expiresAt: '2026-11-13T15:04:05Z'
                idleExpiresAt: '2026-10-14T23:04:05Z'
                assuranceLevel: AAL1
    '400':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthenticated
    '403':
      $ref: ../openapi.yaml#/components/responses/CsrfCheckFailed
    '409':
      $ref: ../openapi.yaml#/components/responses/Conflict
    '413':
      $ref: ../openapi.yaml#/components/responses/PayloadTooLarge
    '415':
      $ref: ../openapi.yaml#/components/responses/UnsupportedMediaType
    '422':
      $ref: ../openapi.yaml#/components/responses/IdempotencyKeyReused
    '429':
      $ref: ../openapi.yaml#/components/responses/RateLimited
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalError
    '503':
      $ref: ../openapi.yaml#/components/responses/ServiceUnavailable

#
# The public API contract of Orcon, version 1. It is the source of truth of the API: the
# server (oapi-codegen), the SDKs, the CLI tree, the MCP catalog and the reference site
# are generated from it. Rules: .agents/skills/orcon-api/references/. Check: make api-check.
openapi: 3.1.0
info:
  title: Orcon API
  version: 1.0.0
  summary: The management API of Orcon.
  description: 'The one API behind the editor, the CLI, the SDKs and the MCP server.

    Every capability of the product is an operation of this document.

    '
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
    description: This installation.
security:
  - bearer: []
  - sessionCookie: []
tags:
  - name: session
    description: Signing in and out of the browser and the user who is signed in.
  - name: organizations
    description: The organizations the signed-in user belongs to.
  - name: projects
    description: Projects that group flows, credentials and executions inside an organization.
  - name: flows
    description: Flows, their drafts, versions and lifecycle.
  - name: testing
    description: Test sessions that let you try a draft with real events.
  - name: executions
    description: Executions of flows and the actions that finish or repeat them.
  - name: node-types
    description: The node types a project can use in its flows.
  - name: credentials
    description: Secret settings a project keeps for outside services; secret values are write-only.
paths:
  /users/me:
    $ref: ./paths/current-user.yaml
  /users/me/sessions:
    $ref: ./paths/user-sessions.yaml
  /users/me/sessions/{sessionId}/revoke:
    $ref: ./paths/user-session-revoke.yaml
  /orgs:
    $ref: ./paths/orgs.yaml
  /orgs/{orgId}/projects:
    $ref: ./paths/org-projects.yaml
  /projects/{projectId}:
    $ref: ./paths/project.yaml
  /projects/{projectId}/flows:
    $ref: ./paths/project-flows.yaml
  /projects/{projectId}/executions:
    $ref: ./paths/project-executions.yaml
  /projects/{projectId}/node-types:
    $ref: ./paths/project-node-types.yaml
  /flows/{flowId}:
    $ref: ./paths/flow.yaml
  /flows/{flowId}/draft:
    $ref: ./paths/flow-draft.yaml
  /flows/{flowId}/draft/validate:
    $ref: ./paths/flow-draft-validate.yaml
  /flows/{flowId}/versions:
    $ref: ./paths/flow-versions.yaml
  /flows/{flowId}/versions/{version}:
    $ref: ./paths/flow-version.yaml
  /flows/{flowId}/publish:
    $ref: ./paths/flow-publish.yaml
  /flows/{flowId}/activate:
    $ref: ./paths/flow-activate.yaml
  /flows/{flowId}/deactivate:
    $ref: ./paths/flow-deactivate.yaml
  /flows/{flowId}/rollback:
    $ref: ./paths/flow-rollback.yaml
  /flows/{flowId}/executions:
    $ref: ./paths/flow-executions.yaml
  /flows/{flowId}/test-sessions:
    $ref: ./paths/flow-test-sessions.yaml
  /flows/{flowId}/test-sessions/{testSessionId}:
    $ref: ./paths/flow-test-session.yaml
  /flows/{flowId}/test-sessions/{testSessionId}/cancel:
    $ref: ./paths/flow-test-session-cancel.yaml
  /executions/{executionId}:
    $ref: ./paths/execution.yaml
  /executions/{executionId}/data:
    $ref: ./paths/execution-data.yaml
  /executions/{executionId}/nodes:
    $ref: ./paths/execution-nodes.yaml
  /executions/{executionId}/events:
    $ref: ./paths/execution-events.yaml
  /executions/{executionId}/cancel:
    $ref: ./paths/execution-cancel.yaml
  /executions/{executionId}/retry:
    $ref: ./paths/execution-retry.yaml
  /external-operations/{externalOperationId}/resolve:
    $ref: ./paths/external-operation-resolve.yaml
  /human-tasks/{humanTaskId}/complete:
    $ref: ./paths/human-task-complete.yaml
  /projects/{projectId}/credentials:
    $ref: ./paths/project-credentials.yaml
  /credentials/{credentialId}:
    $ref: ./paths/credential.yaml
  /credentials/{credentialId}/secret:
    $ref: ./paths/credential-secret.yaml
  /credentials/{credentialId}/shares:
    $ref: ./paths/credential-shares.yaml
  /credentials/{credentialId}/shares/{projectId}:
    $ref: ./paths/credential-share.yaml
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API key, a service account token or a session token, sent as a bearer credential.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-orcon_session
      description: >-
        The browser session, set by createSession as an HttpOnly, Secure, SameSite=Lax cookie with Path=/.
        Browsers also hold a readable CSRF cookie, __Host-orcon_csrf (Secure, SameSite=Strict, Path=/). Every
        unsafe request (POST, PUT, PATCH, DELETE) authenticated by this cookie must send the value of that
        CSRF cookie in the Orcon-Csrf-Token header and must come from the public origin of the installation;
        otherwise the response is 403 csrf-check-failed. Requests that carry an API key as a bearer
        credential use no cookie and no CSRF token.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Id of the session.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a80
    OrgId:
      name: orgId
      in: path
      required: true
      description: Id of the organization.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a71
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Id of the project.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
    FlowId:
      name: flowId
      in: path
      required: true
      description: Id of the flow.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
    ExecutionId:
      name: executionId
      in: path
      required: true
      description: Id of the execution.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a64
    TestSessionId:
      name: testSessionId
      in: path
      required: true
      description: Id of the test session.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a69
    ExternalOperationId:
      name: externalOperationId
      in: path
      required: true
      description: Id of the external operation.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a67
    CredentialId:
      name: credentialId
      in: path
      required: true
      description: Id of the credential.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a90
    HumanTaskId:
      name: humanTaskId
      in: path
      required: true
      description: Id of the human task.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a68
    Version:
      name: version
      in: path
      required: true
      description: Number of the flow version, starting at 1.
      schema:
        type: integer
        minimum: 1
        examples:
          - 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the representation the change is based on.
      schema:
        type: string
        maxLength: 255
        examples:
          - '"1"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client key that makes a retried request return the first response.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[\x21-\x7E]+$
        examples:
          - publish-example-1
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Client key that makes a retried request return the first response.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[\x21-\x7E]+$
        examples:
          - run-example-1
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items in the page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
        examples:
          - 50
    PageToken:
      name: pageToken
      in: query
      required: false
      description: Opaque token from nextPageToken of the previous page.
      schema:
        type: string
        maxLength: 1024
        examples:
          - example-page-token-2
  headers:
    ETag:
      description: Strong entity tag of the returned representation.
      schema:
        type: string
        examples:
          - '"1"'
    Location:
      description: Absolute path of the created resource or of the resource that tracks the work.
      schema:
        type: string
        maxLength: 2048
        examples:
          - /api/v1/executions/0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a64
    OrconRequestId:
      description: Id of the request, also present in logs and problem documents.
      schema:
        type: string
        format: uuid
        examples:
          - 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a62
    RateLimit:
      description: Remaining quota of the rate class in the current window.
      schema:
        type: string
        examples:
          - '"write";r=118;t=42'
    RateLimitPolicy:
      description: Quota policy of the rate class.
      schema:
        type: string
        examples:
          - '"write";q=300;w=60'
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
        examples:
          - 30
  schemas:
    Problem:
      $ref: ./schemas/problem.yaml#/Problem
    ProblemFieldError:
      $ref: ./schemas/problem.yaml#/ProblemFieldError
    SessionCredentials:
      $ref: ./schemas/session.yaml#/SessionCredentials
    Session:
      $ref: ./schemas/session.yaml#/Session
    CurrentUser:
      $ref: ./schemas/session.yaml#/CurrentUser
    Organization:
      $ref: ./schemas/session.yaml#/Organization
    OrganizationList:
      $ref: ./schemas/session.yaml#/OrganizationList
    ProblemCode:
      $ref: ./schemas/problem.yaml#/ProblemCode
    Project:
      $ref: ./schemas/project.yaml#/Project
    ProjectList:
      $ref: ./schemas/project.yaml#/ProjectList
    CreateProjectRequest:
      $ref: ./schemas/project.yaml#/CreateProjectRequest
    UpdateProjectRequest:
      $ref: ./schemas/project.yaml#/UpdateProjectRequest
    Flow:
      $ref: ./schemas/flow.yaml#/Flow
    FlowList:
      $ref: ./schemas/flow.yaml#/FlowList
    CreateFlowRequest:
      $ref: ./schemas/flow.yaml#/CreateFlowRequest
    UpdateFlowRequest:
      $ref: ./schemas/flow.yaml#/UpdateFlowRequest
    FlowDocument:
      $ref: ./schemas/draft.yaml#/FlowDocument
    ValidationIssue:
      $ref: ./schemas/draft.yaml#/ValidationIssue
    ValidationResult:
      $ref: ./schemas/draft.yaml#/ValidationResult
    FlowDraft:
      $ref: ./schemas/draft.yaml#/FlowDraft
    ReplaceDraftRequest:
      $ref: ./schemas/draft.yaml#/ReplaceDraftRequest
    JsonPatchOperation:
      $ref: ./schemas/draft.yaml#/JsonPatchOperation
    JsonPatch:
      $ref: ./schemas/draft.yaml#/JsonPatch
    FlowVersion:
      $ref: ./schemas/version.yaml#/FlowVersion
    FlowVersionList:
      $ref: ./schemas/version.yaml#/FlowVersionList
    PublishFlowRequest:
      $ref: ./schemas/version.yaml#/PublishFlowRequest
    RollbackFlowRequest:
      $ref: ./schemas/version.yaml#/RollbackFlowRequest
    ExecutionFailure:
      $ref: ./schemas/execution.yaml#/ExecutionFailure
    Execution:
      $ref: ./schemas/execution.yaml#/Execution
    ExecutionList:
      $ref: ./schemas/execution.yaml#/ExecutionList
    CreateExecutionRequest:
      $ref: ./schemas/execution.yaml#/CreateExecutionRequest
    NodeExecution:
      $ref: ./schemas/execution.yaml#/NodeExecution
    NodeExecutionList:
      $ref: ./schemas/execution.yaml#/NodeExecutionList
    ExecutionEvent:
      $ref: ./schemas/execution.yaml#/ExecutionEvent
    ExecutionEventList:
      $ref: ./schemas/execution.yaml#/ExecutionEventList
    ExecutionDataEntry:
      $ref: ./schemas/execution.yaml#/ExecutionDataEntry
    ExecutionDataList:
      $ref: ./schemas/execution.yaml#/ExecutionDataList
    TestSession:
      $ref: ./schemas/execution.yaml#/TestSession
    TestSessionAddress:
      $ref: ./schemas/execution.yaml#/TestSessionAddress
    CreateTestSessionRequest:
      $ref: ./schemas/execution.yaml#/CreateTestSessionRequest
    ExternalOperation:
      $ref: ./schemas/execution.yaml#/ExternalOperation
    ResolveExternalOperationRequest:
      $ref: ./schemas/execution.yaml#/ResolveExternalOperationRequest
    HumanTask:
      $ref: ./schemas/execution.yaml#/HumanTask
    CompleteHumanTaskRequest:
      $ref: ./schemas/execution.yaml#/CompleteHumanTaskRequest
    NodeTypeOperation:
      $ref: ./schemas/node-type.yaml#/NodeTypeOperation
    NodeType:
      $ref: ./schemas/node-type.yaml#/NodeType
    NodeTypeList:
      $ref: ./schemas/node-type.yaml#/NodeTypeList
    Credential:
      $ref: ./schemas/credential.yaml#/Credential
    CredentialSecret:
      $ref: ./schemas/credential.yaml#/CredentialSecret
    CredentialList:
      $ref: ./schemas/credential.yaml#/CredentialList
    CreateCredentialRequest:
      $ref: ./schemas/credential.yaml#/CreateCredentialRequest
    UpdateCredentialRequest:
      $ref: ./schemas/credential.yaml#/UpdateCredentialRequest
    ReplaceCredentialSecretRequest:
      $ref: ./schemas/credential.yaml#/ReplaceCredentialSecretRequest
    ShareCredentialRequest:
      $ref: ./schemas/credential.yaml#/ShareCredentialRequest
  responses:
    ValidationFailed:
      description: A parameter or the body is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: No valid credential was sent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CsrfCheckFailed:
      description: The request did not carry a valid CSRF token or came from another origin.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller lacks the required permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The resource state does not allow the operation, or an identical request is still running.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match does not match the current ETag.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The body exceeds the size limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The body is not in a media type the operation accepts.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyKeyReused:
      description: The idempotency key was used with a different request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match is missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The rate class quota is exhausted.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: An unexpected server error happened.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: The operation is not available yet, or the server is starting, stopping or overloaded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

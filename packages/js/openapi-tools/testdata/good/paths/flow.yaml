x-orcon-resource: item
parameters:
  - $ref: '../openapi.yaml#/components/parameters/FlowId'
get:
  operationId: getFlow
  summary: Get a flow
  description: >-
    Returns one flow with the ETag of its current representation. Use the ETag as If-Match
    when you change or delete the flow.
  tags: [flows]
  x-orcon-permission: flow:read
  x-orcon-rate-class: read
  x-orcon-stability: stable
  x-orcon-audit: none
  x-orcon-problems:
    - unauthenticated
    - forbidden
    - not-found
    - validation-failed
    - rate-limited
    - internal-error
  x-orcon-cli:
    command: flows get
  x-orcon-mcp:
    level: read
    tool: get_flow
    description: Get one flow by id.
  x-orcon-examples:
    - name: getExistingFlow
      scenario: project-with-three-flows
      request:
        pathParams:
          flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
      response:
        status: 200
        body: getExistingFlow
  responses:
    '200':
      description: The flow.
      headers:
        ETag:
          $ref: '../openapi.yaml#/components/headers/ETag'
        Orcon-Request-Id:
          $ref: '../openapi.yaml#/components/headers/OrconRequestId'
        RateLimit:
          $ref: '../openapi.yaml#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '../openapi.yaml#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Flow'
          examples:
            getExistingFlow:
              summary: An active flow
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
                projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                name: Sync CRM contacts
                status: ACTIVE
                updatedAt: '2026-10-12T15:04:05Z'
    '400':
      $ref: '../openapi.yaml#/components/responses/ValidationFailed'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthenticated'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '429':
      $ref: '../openapi.yaml#/components/responses/RateLimited'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalError'
patch:
  operationId: updateFlow
  summary: Update a flow
  description: >-
    Changes the fields you send and leaves the others as they are (JSON Merge Patch). Send the
    ETag you read in If-Match; a stale ETag is refused so concurrent edits are never lost.
  tags: [flows]
  x-orcon-permission: flow:update
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-audit: flow.updated
  x-orcon-problems:
    - unauthenticated
    - forbidden
    - not-found
    - validation-failed
    - payload-too-large
    - precondition-failed
    - precondition-required
    - rate-limited
    - internal-error
  x-orcon-cli:
    command: flows update
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: renameFlow
      scenario: project-with-three-flows
      request:
        pathParams:
          flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
        headers:
          If-Match: '"7"'
        body: renameFlow
      response:
        status: 200
        body: renameFlow
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IfMatch'
  requestBody:
    required: true
    content:
      application/merge-patch+json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/UpdateFlowRequest'
        examples:
          renameFlow:
            summary: Rename the flow
            value:
              name: Sync CRM contacts and companies
  responses:
    '200':
      description: The updated flow.
      headers:
        ETag:
          $ref: '../openapi.yaml#/components/headers/ETag'
        Orcon-Request-Id:
          $ref: '../openapi.yaml#/components/headers/OrconRequestId'
        RateLimit:
          $ref: '../openapi.yaml#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '../openapi.yaml#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Flow'
          examples:
            renameFlow:
              summary: The renamed flow
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
                projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                name: Sync CRM contacts and companies
                status: ACTIVE
                updatedAt: '2026-10-12T15:10:00Z'
    '400':
      $ref: '../openapi.yaml#/components/responses/ValidationFailed'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthenticated'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '412':
      $ref: '../openapi.yaml#/components/responses/PreconditionFailed'
    '413':
      $ref: '../openapi.yaml#/components/responses/PayloadTooLarge'
    '428':
      $ref: '../openapi.yaml#/components/responses/PreconditionRequired'
    '429':
      $ref: '../openapi.yaml#/components/responses/RateLimited'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalError'
delete:
  operationId: deleteFlow
  summary: Delete a flow
  description: >-
    Deletes the flow and its draft permanently. Published versions that executions still use
    are kept until those executions finish; the flow cannot be restored afterwards.
  tags: [flows]
  x-orcon-permission: flow:delete
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-audit: flow.deleted
  x-orcon-problems:
    - unauthenticated
    - forbidden
    - not-found
    - validation-failed
    - precondition-failed
    - precondition-required
    - rate-limited
    - internal-error
  x-orcon-cli:
    command: flows delete
  x-orcon-mcp:
    level: none
  x-orcon-examples:
    - name: deleteFlow
      scenario: project-with-three-flows
      request:
        pathParams:
          flowId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
        headers:
          If-Match: '"7"'
      response:
        status: 204
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IfMatch'
  responses:
    '204':
      description: The flow was deleted.
      headers:
        Orcon-Request-Id:
          $ref: '../openapi.yaml#/components/headers/OrconRequestId'
    '400':
      $ref: '../openapi.yaml#/components/responses/ValidationFailed'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthenticated'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '412':
      $ref: '../openapi.yaml#/components/responses/PreconditionFailed'
    '428':
      $ref: '../openapi.yaml#/components/responses/PreconditionRequired'
    '429':
      $ref: '../openapi.yaml#/components/responses/RateLimited'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalError'

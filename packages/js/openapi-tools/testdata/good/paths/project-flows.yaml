x-orcon-resource: collection
parameters:
  - $ref: '../openapi.yaml#/components/parameters/ProjectId'
get:
  operationId: listFlows
  summary: List the flows of a project
  description: >-
    Returns the flows of one project, one page at a time, ordered by the sort expression.
    Use the filters to narrow the list and pass nextPageToken back as pageToken to read the
    next page; the list never includes flows of other projects.
  tags: [flows]
  x-orcon-permission: flow:read
  x-orcon-rate-class: read
  x-orcon-stability: stable
  x-orcon-audit: none
  x-orcon-problems:
    - unauthenticated
    - forbidden
    - not-found
    - validation-failed
    - invalid-page-token
    - rate-limited
    - internal-error
  x-orcon-cli:
    command: flows list
  x-orcon-mcp:
    level: read
    tool: search_flows
    description: Search the flows of a project by name prefix, status or tag.
  x-orcon-examples:
    - name: firstPageOfFlows
      scenario: project-with-three-flows
      request:
        pathParams:
          projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
        query:
          limit: 2
          sort: -updatedAt
      response:
        status: 200
        body: firstPageOfFlows
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/Limit'
    - $ref: '../openapi.yaml#/components/parameters/PageToken'
    - name: sort
      in: query
      required: false
      description: Sort expression; a leading minus sorts in descending order.
      x-orcon-sort-default: -updatedAt
      schema:
        type: string
        enum: [name, -name, updatedAt, -updatedAt]
        x-orcon-enum-kind: identifier
        default: -updatedAt
    - name: status
      in: query
      required: false
      description: Return only flows in this activation status.
      schema:
        type: string
        enum: [ACTIVE, INACTIVE]
    - name: q
      in: query
      required: false
      description: Return only flows whose name starts with this text (case-insensitive).
      schema:
        type: string
        maxLength: 200
        examples: [Sync]
  responses:
    '200':
      description: One page of flows.
      headers:
        Orcon-Request-Id:
          $ref: '../openapi.yaml#/components/headers/OrconRequestId'
        RateLimit:
          $ref: '../openapi.yaml#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '../openapi.yaml#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/FlowList'
          examples:
            firstPageOfFlows:
              summary: Two flows and a token for the next page
              value:
                items:
                  - id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
                    projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                    name: Sync CRM contacts
                    status: ACTIVE
                    updatedAt: '2026-10-12T15:04:05Z'
                  - id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a63
                    projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                    name: Nightly invoice export
                    status: INACTIVE
                    updatedAt: '2026-10-11T09:30:00Z'
                nextPageToken: example-page-token-2
    '400':
      $ref: '../openapi.yaml#/components/responses/ValidationFailed'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthenticated'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '429':
      $ref: '../openapi.yaml#/components/responses/RateLimited'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalError'
post:
  operationId: createFlow
  summary: Create a flow in a project
  description: >-
    Creates an empty flow in the project and returns it with its id. Use it to start a new
    automation; the flow has no published version until you publish its draft.
  tags: [flows]
  x-orcon-permission: flow:create
  x-orcon-rate-class: write
  x-orcon-stability: stable
  x-orcon-idempotency: optional
  x-orcon-audit: flow.created
  x-orcon-problems:
    - unauthenticated
    - forbidden
    - not-found
    - validation-failed
    - payload-too-large
    - idempotency-key-reused
    - idempotency-in-progress
    - rate-limited
    - internal-error
  x-orcon-cli:
    command: flows create
  x-orcon-mcp:
    level: write
    tool: create_flow
    description: Create an empty flow in a project.
  x-orcon-examples:
    - name: createNamedFlow
      scenario: empty-project
      request:
        pathParams:
          projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
        body: createNamedFlow
      response:
        status: 201
        body: createNamedFlow
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/CreateFlowRequest'
        examples:
          createNamedFlow:
            summary: A flow with a name
            value:
              name: Sync CRM contacts
  responses:
    '201':
      description: The created flow.
      headers:
        ETag:
          $ref: '../openapi.yaml#/components/headers/ETag'
        Location:
          $ref: '../openapi.yaml#/components/headers/Location'
        Orcon-Request-Id:
          $ref: '../openapi.yaml#/components/headers/OrconRequestId'
        RateLimit:
          $ref: '../openapi.yaml#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '../openapi.yaml#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Flow'
          examples:
            createNamedFlow:
              summary: The new flow
              value:
                id: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a60
                projectId: 0191f6a2-3c4d-7e8f-9a0b-1c2d3e4f5a70
                name: Sync CRM contacts
                status: INACTIVE
                updatedAt: '2026-10-12T15:04:05Z'
    '400':
      $ref: '../openapi.yaml#/components/responses/ValidationFailed'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthenticated'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
    '413':
      $ref: '../openapi.yaml#/components/responses/PayloadTooLarge'
    '422':
      $ref: '../openapi.yaml#/components/responses/IdempotencyKeyReused'
    '429':
      $ref: '../openapi.yaml#/components/responses/RateLimited'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalError'
